<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fitness-Dashboard</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fitness">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECEFF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1015" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: App-Shell fürs iPhone. Kopfzeile mit Datum, eine Spalte Karten (ab 900px zwei), Tab-Leiste unten.
   Makro-Farben folgen den Hantelscheiben: Protein rot (25 kg), Kohlenhydrate gelb (15 kg), Fett grün (10 kg). */
:root{
  --bg:#ECEFF4; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#131821; --ink-2:#465163; --muted:#6E7889; --line:#D9DFE8;
  --accent:#2146BD; --accent-ink:#FFFFFF; --accent-soft:#E2E8F8;
  --p:#CF3B2B; --c:#C08A00; --f:#2E8754;
  --good:#1D7F47; --warn:#A86400; --bad:#BF3328;
  --shadow:0 1px 2px rgba(19,24,33,.06),0 2px 8px rgba(19,24,33,.04);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1015; --surface:#161A21; --surface-2:#1D222B; --ink:#E8ECF2; --ink-2:#B0B8C5; --muted:#808A9A; --line:#2A303B;
  --accent:#7D97FF; --accent-ink:#0D1015; --accent-soft:#222B45;
  --p:#F2705E; --c:#E7B53A; --f:#5BBE86;
  --good:#5BC489; --warn:#E5A24A; --bad:#F07A6E;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#161A21; --surface-2:#1D222B; --ink:#E8ECF2; --ink-2:#B0B8C5; --muted:#808A9A; --line:#2A303B;
  --accent:#7D97FF; --accent-ink:#0D1015; --accent-soft:#222B45;
  --p:#F2705E; --c:#E7B53A; --f:#5BBE86;
  --good:#5BC489; --warn:#E5A24A; --bad:#F07A6E;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,select,textarea,label{touch-action:manipulation}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.app{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px 10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top h1{font-size:26px;line-height:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:active{transform:scale(.96)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Tab-Leiste */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabs button{background:none;border:0;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;min-width:0;font-weight:500;cursor:pointer}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent)}

/* Karten */
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:900px){.grid.two{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-h h2{font-size:20px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stack{display:flex;flex-direction:column;gap:10px}
.big{font-family:var(--display);font-size:44px;font-weight:600;line-height:.95;font-variant-numeric:tabular-nums}
.mid{font-family:var(--display);font-size:28px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.unit{font-family:var(--body);font-size:14px;font-weight:500;color:var(--muted);margin-left:3px}
.section-title{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}

/* Buttons & Felder */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:600;font-size:14.5px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn:active:not(:disabled){transform:scale(.98)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.inp{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:16px;min-height:42px}
.inp:focus{outline:none;border-color:var(--accent);background:var(--surface)}
textarea.inp{min-height:84px;resize:vertical}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 10px;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Fortschrittsbalken */
.bar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar.over i{background:var(--bad)}
.macro{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:10px;font-size:14px}
.macro .lbl{display:flex;align-items:center;gap:7px;font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

/* Listen */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .title{font-weight:500;overflow-wrap:anywhere}
.li .sub{font-size:13px;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;flex:none;font-size:18px;line-height:1}
.x:hover{background:var(--surface-2);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.good{color:var(--good)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)} .chip.acc{color:var(--accent);background:var(--accent-soft);border-color:transparent}

/* Supplements */
.supp{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);cursor:pointer;text-align:left;width:100%}
.supp .chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface)}
.supp[aria-pressed="true"]{border-color:var(--good)}
.supp[aria-pressed="true"] .chk{background:var(--good);border-color:var(--good)}
.supp .chk svg{width:14px;height:14px;stroke:var(--surface);stroke-width:3;fill:none;opacity:0}
.supp[aria-pressed="true"] .chk svg{opacity:1}
.supp .t{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);margin-left:auto}
.adh{display:grid;gap:3px;font-size:11px;overflow-x:auto}
.adh .c{width:100%;aspect-ratio:1;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);min-width:14px}
.adh .c.on{background:var(--good);border-color:var(--good)}

/* Kalender */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:2px;letter-spacing:.04em}
.cal button{aspect-ratio:1;max-width:100%;border:1px solid transparent;background:var(--surface-2);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-variant-numeric:tabular-nums;font-size:14px;padding:0}
.cal button.out{opacity:.35}
.cal button.today{border-color:var(--accent);color:var(--accent);font-weight:700}
.cal button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cal .marks{display:flex;gap:3px;height:7px}
.cal .m{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.cal .m.plan{background:transparent;border:1.5px solid var(--accent)}
.cal .m.act{background:var(--c)}
.cal button[aria-pressed="true"] .m{background:var(--accent-ink)}
.cal button[aria-pressed="true"] .m.plan{background:transparent;border-color:var(--accent-ink)}

/* Training-Session */
.ex{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.ex + .ex{margin-top:10px}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:6px;align-items:center;margin-top:8px}
.sets .h{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.sets .idx{font-weight:600;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.sets .inp{text-align:center;padding:7px 4px;min-height:40px}
.tick{height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer;display:grid;place-items:center}
.tick svg{width:18px;height:18px;stroke:var(--muted);stroke-width:2.6;fill:none}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.tick[aria-pressed="true"] svg{stroke:var(--surface)}
.hint{font-size:13px;border-radius:9px;padding:7px 10px;background:var(--accent-soft);color:var(--ink)}
.hint.good{background:color-mix(in srgb,var(--good) 14%,var(--surface))}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(8,10,14,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:88%}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.sheet-h h2{font-size:22px;flex:1;min-width:0}
.sheet-b{overflow-y:auto;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
.sheet-f{padding:10px 16px 12px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--bg)}

/* Diagramme */
.chart{position:relative;width:100%;min-height:60px}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 9px;font-size:12.5px;line-height:1.35;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-10px;z-index:3;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ln{width:16px;height:2px;background:var(--accent);display:inline-block}

.banner{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.empty{text-align:center;padding:18px 8px;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.kv > div{min-width:0}
.kv .v{font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.05}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.searchres{max-height:300px;overflow-y:auto}
.rec{display:flex;flex-direction:column;gap:14px}
.quote{margin:0;padding:2px 2px 12px;border-bottom:1px solid var(--line)}
.quote blockquote{margin:0;font-family:var(--display);font-size:21px;font-weight:500;line-height:1.2;text-wrap:balance}
.quote blockquote::before{content:"„"}.quote blockquote::after{content:"“"}
.quote figcaption{margin-top:6px;font-size:13px;color:var(--muted);font-weight:500}
.quote figcaption::before{content:"– "}
.dials{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.dialw{min-width:0}
.dial{position:relative;width:100%;max-width:132px;aspect-ratio:1;margin:0 auto}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .in{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;padding-top:34%}
.dial .dv{font-family:var(--display);font-size:clamp(24px,8vw,38px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.dial .du{font-size:13px;color:var(--muted);font-weight:600;margin-left:2px}
.dl{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.ds{font-size:12px;color:var(--muted);line-height:1.25}
.checkin{background:var(--surface-2);border-radius:12px;padding:12px;border:1px solid var(--line)}
.checkin .seg{background:var(--surface)}
.checkin .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tips .li{padding:9px 0}
.restbar{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;margin:14px -16px -20px;padding:12px 16px;background:var(--surface);border-top:2px solid var(--accent);box-shadow:0 -4px 16px rgba(0,0,0,.12)}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;flex:none}
.av.sm{width:22px;height:22px;font-size:12px}
.feed{margin-bottom:12px}
.fhead{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.ftitle{font-family:var(--display);font-size:22px;font-weight:600;margin-bottom:8px}
.kudos{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}
.kudos[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.plancat{font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:12px 0 4px}
.planitem{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;margin-top:6px}
.planitem .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface);margin-top:1px}
.planitem .chk svg{width:13px;height:13px;stroke:var(--surface);stroke-width:3;fill:none;opacity:0}
.planitem[aria-pressed="true"]{border-color:var(--good)}
.planitem[aria-pressed="true"] .chk{background:var(--good);border-color:var(--good)}
.planitem[aria-pressed="true"] .chk svg{opacity:1}
.planitem[aria-pressed="true"] b{text-decoration:line-through;text-decoration-color:var(--muted)}
.pick{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;cursor:pointer;display:flex;gap:8px;align-items:center}
.pick:first-child{border-top:0}
.pick:hover{background:var(--surface-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="view" aria-live="polite"></main>
</div>
<div class="tabs"><nav id="tabs" aria-label="Bereiche"></nav></div>
<div class="scrim" id="scrim" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";

/* Kein Zoomen: Pinch-Gesten und Doppeltipp-Zoom unterbinden (iOS ignoriert user-scalable allein). */
["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive: false}));
["touchstart", "touchmove"].forEach(t => window.addEventListener(t, e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, {passive: false, capture: true}));
const APP_VERSION = "04.10.2026 08:53";
/* Neue Version sofort laden statt bis zu 10 Minuten die zwischengespeicherte zu zeigen. */
async function checkUpdate(){
  if (APP_VERSION.startsWith("__")) return;
  try {
    const html = await (await fetch(location.pathname + "?check=" + Date.now(), {cache: "no-store"})).text();
    const m = html.match(/APP_VERSION = "([^"]+)"/);
    if (m && m[1] !== APP_VERSION && !m[1].startsWith("__")) location.replace(location.pathname + "?v=" + encodeURIComponent(m[1]));
  } catch(e) {}
}
checkUpdate();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
/* Doppeltipp-Zoom verhindert touch-action im CSS, ohne schnelle Tipps zu verschlucken. */

/* ---------- Hilfsfunktionen ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o ?? {}));
const pad = n => String(n).padStart(2, "0");
const keyOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const dateOf = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };

function workoutLine(w){

/* ----- Pausen-Timer im laufenden Training ----- */
let rest = null, restTick = null;
function restSeconds(txt){
  const t = String(txt || "").toLowerCase().replace(",", ".");
  const m = t.match(/(\d+(?:\.\d+)?)/); if (!m) return cfg().restDefault || 120;
  const v = parseFloat(m[1]);
  return Math.round(/s(ek|\b)/.test(t) && !/min/.test(t) ? v : v * 60);
}
function nextSetLabel(){
  for (const e of (ws && ws.exercises) || []) { const i = (e.sets || []).findIndex(x => !x.done); if (i >= 0) return (exName(e.exId) || e.name) + " – Satz " + (i + 1); }
  return null;
}
function startRest(ei){
  const e = ws.exercises[ei]; const secs = restSeconds(e && e.target && e.target.rest);
  rest = {end: Date.now() + secs * 1000};
  clearInterval(restTick); restTick = setInterval(updateRestBar, 500); updateRestBar();
  schedulePushRest(secs);
}
function schedulePushRest(secs){
  if (pushState !== "on") return;
  const nxt = nextSetLabel();
  sb.rpc("start_rest_timer", {p_seconds: secs, p_title: "Pause vorbei 💪", p_body: nxt ? "Weiter mit " + nxt + "." : "Weiter geht's mit dem nächsten Satz."});
}
function restAdjust(d){
  if (!rest) return; rest.end += d * 1000; updateRestBar();
  schedulePushRest(Math.max(1, Math.round((rest.end - Date.now()) / 1000)));
}
function stopRest(cancel){

}
function updateRestBar(){
  const el = document.getElementById("restbar"); if (!el) return;
  if (!rest) { el.hidden = true; return; }
  const left = Math.ceil((rest.end - Date.now()) / 1000);
  if (left <= 0) { rest = null; clearInterval(restTick); el.hidden = true; toast("Pause vorbei – nächster Satz! 💪"); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch(e) {} return; }
  el.hidden = false;

}

async function runAiFood(text){

  if (error) { const k = Object.keys(msgs).find(x => (error.message || "").includes(x)); return fail(k ? msgs[k] : "Die KI ist gerade nicht erreichbar. Versuch es gleich noch einmal."); }

    const d = getDay(date); d.meals = d.meals || {}; d.meals[meal] = (d.meals[meal] || []).concat(items); saveDay(date, d);
    const kc = items.reduce((a, x) => a + x.kcal, 0), pr = items.reduce((a, x) => a + x.p, 0);

/* ---------- Diagramme ---------- */
function niceTicks(min, max, n = 4){
  const span = max - min || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw) || raw;
  const out = []; for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}
function drawCharts(){
  document.querySelectorAll("[data-chart]").forEach(el => {
    const kind = el.dataset.chart;
    if (kind === "weight") drawWeight(el, false);
    else if (kind === "spark") drawWeight(el, true);
    else if (kind === "sleep") drawSleep(el);
    else if (kind === "ex") drawEx(el);
    else if (kind === "recovery") drawRecovery(el);
  });
}
function drawRecovery(el){
  const t = todayKey();
  const days = Array.from({length: 14}, (_, i) => { const k = addDays(t, i - 13); const r = recoveryOf(k); return {k, r: r ? r.score : null, s: strainOf(k)}; });
  const W = Math.max(240, el.clientWidth), H = el.clientHeight || 190, padL = 30, padR = 6, padT = 8, padB = 38;
  const Y = v => padT + (1 - v / 100) * (H - padT - padB);
  const bw = (W - padL - padR) / 14;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Erholung und Belastung der letzten 14 Tage">`;
  [0, 33, 67, 100].forEach(v => { s += `<line x1="${padL}" x2="${W - padR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${padL - 5}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`; });
  days.forEach((d, i) => {
    const x = padL + i * bw + 2, w = Math.max(4, bw - 4);
    if (d.r != null) { const y = Y(d.r); const col = {good: "var(--good)", warn: "var(--warn)", bad: "var(--bad)"}[zoneOf(d.r)]; s += `<path d="M${x},${Y(0)} V${y + 4} q0,-4 4,-4 h${w - 8} q4,0 4,4 V${Y(0)} Z" fill="${col}"/>`; }
    s += `<text x="${x + w / 2}" y="${H - 22}" text-anchor="middle" style="fill:var(--ink-2);font-weight:600">${d.s ? fmt(d.s, 0) : "·"}</text>`;
    if (i % 2 === 1 || bw > 30) s += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${WD[dateOf(d.k).getDay()]}</text>`;
    s += `<rect class="hb" data-i="${i}" x="${padL + i * bw}" y="0" width="${bw}" height="${H}" fill="transparent"/>`;
  });
  s += "</svg>";
  el.innerHTML = s + '<div class="tip" hidden></div>';
  const tip = el.querySelector(".tip"), svg = el.querySelector("svg");
  el.querySelectorAll(".hb").forEach(r => { const show = () => { const d = days[+r.dataset.i]; const rr = svg.getBoundingClientRect(); tip.innerHTML = `<b>${fmtMid(d.k)}</b><br>Erholung ${d.r != null ? d.r + " %" : "–"}<br>Belastung ${fmt(d.s, 1)}`; tip.hidden = false; tip.style.left = Math.min(Math.max((padL + (+r.dataset.i + .5) * bw) / W * rr.width, 60), rr.width - 60) + "px"; tip.style.top = (Y(d.r || 0) / H * rr.height) + "px"; }; r.addEventListener("pointerenter", show); r.addEventListener("pointerdown", show); });
  svg.addEventListener("pointerleave", () => tip.hidden = true);
}
function lineChart(el, o){
  const W = Math.max(240, el.clientWidth), H = el.clientHeight || 220;
  const spark = !!o.spark;
  const padL = spark ? 4 : 36, padR = spark ? 6 : 12, padT = spark ? 6 : 10, padB = spark ? 6 : 24;
  const pts = o.points;
  if (!pts.length) { el.innerHTML = `<div class="empty" style="padding:${spark ? 6 : 30}px">${esc(o.empty || "Noch keine Daten.")}</div>`; return; }
  const t0 = dateOf(o.from || pts[0].k).getTime(), t1 = Math.max(dateOf(pts[pts.length - 1].k).getTime(), o.to ? dateOf(o.to).getTime() : 0, t0 + 864e5 * 6);
  let vals = pts.map(p => p.v).concat((o.line || []).map(p => p.v));
  if (o.band && !spark) vals = vals.concat(o.band);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const padV = Math.max((hi - lo) * 0.08, o.minPad || 0.5); lo -= padV; hi += padV;
  const X = k => padL + (dateOf(k).getTime() - t0) / (t1 - t0) * (W - padL - padR);
  const Y = v => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.label || "Diagramm")}">`;
  if (!spark) {
    niceTicks(lo, hi, 4).forEach(v => { s += `<line x1="${padL}" x2="${W - padR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${padL - 6}" y="${Y(v) + 4}" text-anchor="end">${fmt(v, o.dec || 0)}</text>`; });
    const days = (t1 - t0) / 864e5, n = Math.min(5, Math.max(2, Math.floor((W - padL) / 90)));
    for (let i = 0; i < n; i++) { const t = t0 + (t1 - t0) * i / (n - 1); const k = keyOf(new Date(t)); s += `<text x="${X(k)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}">${days > 300 ? MON[dateOf(k).getMonth()].slice(0, 3) + " " + String(dateOf(k).getFullYear()).slice(2) : fmtShort(k)}</text>`; }
  }
  if (o.band && !spark) s += o.band[0] === o.band[1]
    ? `<line x1="${padL}" x2="${W - padR}" y1="${Y(o.band[0])}" y2="${Y(o.band[0])}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W - padR}" y="${Y(o.band[0]) - 5}" text-anchor="end">Ziel ${fmt(o.band[0], 1)} kg</text>`
    : `<rect x="${padL}" width="${W - padL - padR}" y="${Y(o.band[1])}" height="${Math.max(2, Y(o.band[0]) - Y(o.band[1]))}" fill="var(--accent-soft)"/>`;
  if (o.connect) s += `<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p => X(p.k) + "," + Y(p.v)).join(" ")}"/>`;
  if (o.line && o.line.length > 1) s += `<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${o.line.map(p => X(p.k) + "," + Y(p.v)).join(" ")}"/>`;
  if (!spark || pts.length < 40) pts.forEach(p => { s += `<circle cx="${X(p.k)}" cy="${Y(p.v)}" r="${spark ? 2 : o.connect ? 4 : 3.5}" fill="${o.connect ? "var(--accent)" : "var(--muted)"}" stroke="var(--surface)" stroke-width="${o.connect ? 2 : 0}"/>`; });
  const endP = (o.line && o.line.length) ? o.line[o.line.length - 1] : pts[pts.length - 1];
  s += `<circle cx="${X(endP.k)}" cy="${Y(endP.v)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  s += `<line class="xh" y1="${padT}" y2="${H - padB}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>`;
  s += `<rect x="${padL}" y="0" width="${W - padL - padR}" height="${H}" fill="transparent" class="hit"/></svg>`;
  el.innerHTML = s + '<div class="tip" hidden></div>';
  if (spark) return;
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), xh = el.querySelector(".xh");
  const move = ev => {
    const r = svg.getBoundingClientRect(); const x = (ev.clientX - r.left) * (W / r.width);
    let best = pts[0], bd = 1e9; pts.forEach(p => { const d = Math.abs(X(p.k) - x); if (d < bd) { bd = d; best = p; } });
    const lv = o.line ? (o.line.find(p => p.k === best.k) || {}).v : null;
    tip.innerHTML = o.tip(best, lv);
    tip.hidden = false; tip.style.left = Math.min(Math.max(X(best.k) / W * r.width, 60), r.width - 60) + "px"; tip.style.top = (Y(best.v) / H * r.height) + "px";
    xh.setAttribute("x1", X(best.k)); xh.setAttribute("x2", X(best.k)); xh.setAttribute("opacity", "1");
  };
  svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", () => { tip.hidden = true; xh.setAttribute("opacity", "0"); });
}
function drawWeight(el, spark){

  lineChart(el, {points: ser.filter(inR), line: avg.filter(inR), from: from && ser.some(p => p.k < from) ? from : null, to: todayKey(), band: [c.goalLo, c.goalHi], spark, dec: 0, label: "Gewichtsverlauf",

function drawEx(el){

function drawSleep(el){

  [0, 4, 8].forEach(v => { s += `<line x1="${padL}" x2="${W - padR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${padL - 5}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`; });
  nights.forEach((n, i) => {

    if (i % 2 === 1 || bw > 30) s += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${WD[dateOf(n.k).getDay()]}</text>`;

  });

  el.innerHTML = s + '<div class="tip" hidden></div>';

  el.querySelectorAll(".hb").forEach(r => { const show = () => { const n = nights[+r.dataset.i]; const rr = svg.getBoundingClientRect(); tip.innerHTML = `<b>${fmtMid(n.k)}</b><br>${n.s && n.s.h ? fmt(n.s.h, 1) + " h · " + esc(n.s.bed || "") + "–" + esc(n.s.wake || "") : "Kein Eintrag"}`; tip.hidden = false; tip.style.left = Math.min(Math.max((padL + (+r.dataset.i + .5) * bw) / W * rr.width, 60), rr.width - 60) + "px"; tip.style.top = (Y(n.s && n.s.h ? n.s.h : 0) / H * rr.height) + "px"; }; r.addEventListener("pointerenter", show); r.addEventListener("pointerdown", show); });
  svg.addEventListener("pointerleave", () => tip.hidden = true);
}

async function runEstimate(){
  const desc = ($("#afd") || {}).value || "";
  const file = $("#afi") && $("#afi").files[0];
  if (!desc.trim() && !file) { toast("Beschreibe kurz, was du gegessen hast."); return; }
  af.desc = desc; af.busy = true; af.err = null; af.est = null; af.ctl = new AbortController(); renderAddFood();
  const prompt = `Du bist Ernährungsberater und schätzt Nährwerte für einen 21-jährigen Sportler in Deutschland, der seine Kalorien zählt.
Schätze realistische deutsche Portionsgrößen, wenn keine Mengen genannt sind. Teile die Mahlzeit in ihre Bestandteile auf.
Antworte NUR mit JSON in genau dieser Form:
{"items":[{"name":"Schweinebraten","g":180,"kcal":390,"p":42,"c":0,"f":24}]}
g = geschätzte Menge in Gramm, alle Werte gelten für diese Menge, p/c/f in Gramm (Protein/Kohlenhydrate/Fett), ganze Zahlen. Namen auf Deutsch.
${file ? "Auf dem Foto ist die Mahlzeit zu sehen. " : ""}Beschreibung: ${desc.trim() || "(siehe Foto)"}`;
  try {
    const opts = {signal: af.ctl.signal, modelTier: "default"};
    if (file) opts.images = file;
    const res = await sampleFn.json(prompt, opts);
    const items = (res && Array.isArray(res.items) ? res.items : []).map(it => ({name: String(it.name || "Unbekannt"), g: Math.round(num(it.g) || 0), kcal: Math.round(num(it.kcal) || 0), p: Math.round(num(it.p) || 0), c: Math.round(num(it.c) || 0), f: Math.round(num(it.f) || 0)})).filter(it => it.kcal > 0 || it.g > 0);
    if (!af) return;
    af.est = items.length ? items : null; if (!items.length) af.err = "Claude konnte daraus keine Nährwerte ableiten. Beschreibe die Mahlzeit etwas genauer.";
  } catch(e) {
    if (!af) return;
    const m = {cancelled: null, not_granted: "Du hast die Nutzung von Claude für diese Seite abgelehnt.", rate_limited: "Gerade zu viele Anfragen. Versuche es gleich noch einmal.", invalid_json: "Die Antwort war unvollständig. Bitte noch einmal schätzen lassen.", refused: "Claude hat diese Anfrage nicht beantwortet. Formuliere sie anders.", image_rejected: "Das Foto konnte nicht gelesen werden. Versuche ein anderes.", session_expired: "Bitte melde dich bei claude.ai neu an."};
    af.err = e && e.code in m ? m[e.code] : "Das hat nicht geklappt. Bitte noch einmal versuchen.";
  }
  if (!af) return;
  af.busy = false; af.ctl = null; renderAddFood();
}

/* ---------- Hevy-Import ---------- */
function parseCSV(t){
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(f); f = ""; }
    else if (ch === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (ch !== "\r") f += ch;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows;
}
const MONTHS = {jan:0,feb:1,mar:2,mär:2,apr:3,may:4,mai:4,jun:5,jul:6,aug:7,sep:8,oct:9,okt:9,nov:10,dec:11,dez:11};
function parseHevyDate(s){
  s = String(s || "").trim();
  let m = s.match(/^(\d{1,2})\s+([A-Za-zäÄ]{3})[a-z]*\.?\s+(\d{4}),?\s+(\d{1,2}):(\d{2})/);
  if (m && MONTHS[m[2].toLowerCase()] != null) return new Date(+m[3], MONTHS[m[2].toLowerCase()], +m[1], +m[4], +m[5]);
  const d = new Date(s); return isNaN(d) ? null : d;
}
function guessGroup(n){
  n = n.toLowerCase();
  const r = [["Brust",/bench|chest|fly|butterfly|brust|dip|push/],["Rücken",/row|pulldown|pull up|pull-up|chin|lat|rudern|latzug|deadlift|back ext|hyperext/],["Schultern",/shoulder|lateral|overhead press|rear delt|reverse fly|face pull|seitheben|schulter/],["Bizeps",/curl|bizeps|biceps/],["Trizeps",/tricep|trizeps|pushdown|skull|extension.*(cable|overhead)/],["Waden",/calf|wade/],["Bauch",/crunch|ab |abs|plank|leg raise|knee raise|bauch/],["Beine",/squat|leg|lunge|split|hip|glute|rdl|romanian|bein|presse/]];
  for (const [g, re] of r) if (re.test(n)) return g;
  return "Sonstiges";
}
async function importHevy(file){
  const msg = $("#hevymsg");
  const text = await file.text();
  const rows = parseCSV(text); if (rows.length < 2) { msg.textContent = "Die Datei ist leer."; return; }
  const H = rows[0].map(h => h.trim().toLowerCase());
  const ix = n => H.indexOf(n);
  const iT = ix("title"), iS = ix("start_time"), iE = ix("end_time"), iX = ix("exercise_title"), iTy = ix("set_type"), iKg = ix("weight_kg"), iLb = ix("weight_lbs"), iR = ix("reps"), iDur = ix("duration_seconds"), iDist = ix("distance_km");
  if (iT < 0 || iS < 0 || iX < 0) { msg.textContent = "Das sieht nicht nach einem Hevy-Export aus (Spalten title, start_time, exercise_title fehlen)."; return; }
  const byName = {};
  Object.entries(S.exercises).forEach(([id, e]) => { byName[e.name.toLowerCase().trim()] = id; (e.aliases || []).forEach(a => byName[String(a).toLowerCase().trim()] = id); });
  const groups = new Map();
  rows.slice(1).forEach(r => {
    if (r.length < H.length - 2 || !r[iS]) return;
    const key = r[iS] + "|" + r[iT];
    if (!groups.has(key)) groups.set(key, {title: r[iT], start: r[iS], end: iE >= 0 ? r[iE] : "", ex: new Map()});
    const g = groups.get(key);
    const xn = r[iX];
    if (!g.ex.has(xn)) g.ex.set(xn, []);
    let w = iKg >= 0 ? num(r[iKg]) : NaN; if (isNaN(w) && iLb >= 0) w = num(r[iLb]) * 0.45359;
    g.ex.get(xn).push({w: isNaN(w) ? "" : Math.round(w * 10) / 10, r: num(r[iR]) || "", done: true, type: iTy >= 0 && /warm/i.test(r[iTy]) ? "warmup" : "normal", sec: iDur >= 0 ? num(r[iDur]) || undefined : undefined, km: iDist >= 0 ? num(r[iDist]) || undefined : undefined});
  });
  let added = 0, skipped = 0, newEx = 0, n = 0;
  for (const g of groups.values()) {
    n++; msg.textContent = `Importiere Training ${n} von ${groups.size} …`;
    const sd = parseHevyDate(g.start); if (!sd) { skipped++; continue; }
    const id = "hevy-" + keyOf(sd) + "-" + pad(sd.getHours()) + pad(sd.getMinutes());
    if (S.workouts[id]) { skipped++; continue; }
    const exercises = [];
    for (const [xn, sets] of g.ex) {
      let exId = byName[xn.toLowerCase().trim()];
      if (!exId) { exId = "x-" + xn.toLowerCase().replace(/[^a-z0-9äöüß]+/g, "-").replace(/^-|-$/g, "").slice(0, 60); if (!S.exercises[exId]) { await put("exercises", exId, {name: xn, group: guessGroup(xn), equipment: "", notes: "", aliases: [xn]}); newEx++; } byName[xn.toLowerCase().trim()] = exId; }
      exercises.push({exId, name: xn, sets: sets.map(s => { const o = {w: s.w, r: s.r, done: true, type: s.type}; if (s.sec) o.sec = s.sec; if (s.km) o.km = s.km; return o; })});
    }
    const ed = parseHevyDate(g.end);
    await put("workouts", id, {date: keyOf(sd), title: g.title, status: "done", kind: "strength", source: "hevy", start: sd.toISOString(), end: ed ? ed.toISOString() : "", exercises});
    added++;
  }
  msg.textContent = `Fertig: ${added} Trainings übernommen${skipped ? `, ${skipped} übersprungen (schon vorhanden)` : ""}${newEx ? `, ${newEx} neue Übungen im Register` : ""}.`;
}

  switch (f.dataset.form) {
    case "quick-weight": { const w = num(v("qw")); if (!(w > 30 && w < 250)) { toast("Bitte ein Gewicht in kg eingeben, z. B. 88,4."); return; } const d = getDay(curDate); d.weight = Math.round(w * 10) / 10; saveDay(curDate, d); toast("Gewicht gespeichert."); f.reset(); document.activeElement && document.activeElement.blur(); break; }
    case "body": { const k = v("bd") || todayKey(); const w = num(v("bw")), t = num(v("bt")); if (!(w > 30) && !(t > 30)) { toast("Trage Gewicht oder Taille ein."); return; } const d = getDay(k); if (w > 30 && w < 250) d.weight = Math.round(w * 10) / 10; if (t > 30 && t < 200) d.waist = Math.round(t * 10) / 10; saveDay(k, d); toast("Gespeichert."); f.reset(); document.activeElement && document.activeElement.blur(); break; }
    case "supp-add": { const name = (v("sn") || "").trim(); if (!name) return; const list = (cfg().supplements || []).concat([{id: uid("s"), name, dose: (v("sdo") || "").trim(), time: v("sti") || ""}]); saveCfg({supplements: list}); f.reset(); document.activeElement && document.activeElement.blur(); toast(name + " hinzugefügt."); break; }
    case "sleep": {
      const k = v("sld") || todayKey(), bed = v("slb"), wake = v("slw"), q = v("slq");
      if (!bed || !wake) { toast("Trage Einschlaf- und Aufwachzeit ein."); return; }
      const [bh, bm] = bed.split(":").map(Number), [wh, wm] = wake.split(":").map(Number);
      let mins = (wh * 60 + wm) - (bh * 60 + bm); if (mins <= 0) mins += 1440;
      const d = getDay(k); d.sleep = {bed, wake, h: Math.round(mins / 6) / 10}; if (q) d.sleep.q = +q;
      [["sls","score"],["slh","hrv"],["slr","rhr"],["slbb","bb"]].forEach(([id, key]) => { const x = num(v(id)); if (x > 0) d.sleep[key] = Math.round(x); });
      saveDay(k, d);
      document.activeElement && document.activeElement.blur(); toast("Schlaf gespeichert: " + fmt(mins / 60, 1) + " h."); break;
    }
    case "ai-food": runAiFood(v("aiq")); break;
    case "af-quick": { const it = {name: v("qn").trim(), kcal: Math.round(num(v("qk")) || 0), p: num(v("qp")) || 0, c: num(v("qc")) || 0, f: num(v("qf")) || 0}; addItems(af.meal, [it]); toast(it.name + " hinzugefügt."); closeSheet(); break; }
    case "af-new": { const id = uid("f"); const food = {name: v("nn").trim(), kcal: num(v("nk")) || 0, p: num(v("np")) || 0, c: num(v("nc")) || 0, f: num(v("nf")) || 0, uses: 0}; const po = num(v("npo")); if (po > 0) food.portion = po; put("foods", id, food); af.mode = "suchen"; af.pick = id; af.g = ""; renderAddFood(); break; }
    case "activity": { const k = f.dataset.date; const title = v("acn"); const min = parseInt(v("acm"), 10); put("workouts", uid("a"), {date: k, title, kind: "activity", status: "done", minutes: min > 0 ? min : null}); closeSheet(); toast(title + " eingetragen."); break; }
    case "ex-edit": { const id = f.dataset.id || uid("x"); const prev = S.exercises[id] || {}; put("exercises", id, Object.assign(clone(prev), {name: v("exn").trim(), group: v("exg"), equipment: v("exq").trim(), notes: v("exo").trim()})); closeSheet(); toast("Übung gespeichert."); break; }
    case "auth": {
      authBusy = "in"; const em = v("ae").trim(), pw = v("ap"); authEmail = em; render();
      let error;
      try { ({error} = await sb.auth.signInWithPassword({email: em, password: pw})); } catch (err) { error = {message: String(err && err.message || err)}; }
      authBusy = "";
      if (error) { authMsg = /confirm/i.test(error.message) ? "Deine E-Mail ist noch nicht bestätigt. Öffne den Link in der Bestätigungs-Mail." : "E-Mail oder Passwort stimmen nicht (" + error.message + ")."; render(); return; }
      authMsg = ""; initStore(); break;
    }
    case "signup": {
      const em = v("ae") || "", pw = v("ap") || "";
      if (!em.includes("@") || pw.length < 8) { authMsg = "Gib deine E-Mail und ein Passwort mit mindestens 8 Zeichen ein."; render(); return; }
      authBusy = "up"; authMsg = ""; authEmail = em.trim(); render();
      let data, error;
      try { ({data, error} = await sb.auth.signUp({email: em.trim(), password: pw, options: {emailRedirectTo: location.origin + location.pathname}})); }
      catch (err) { error = {message: String(err && err.message || err)}; }
      authBusy = "";
      if (error) { authMsg = /database error|not_allowed/i.test(error.message) ? "Für diese E-Mail-Adresse gibt es noch keine Einladung. Bitte die Person, die dich eingeladen hat, deine E-Mail-Adresse im Bereich Freunde einzutragen." : "Das Konto konnte nicht angelegt werden: " + error.message; render(); return; }
      if (data.session) { authMsg = ""; initStore(); break; }
      authMode = "login";
      authMsg = "Konto angelegt. Bestätige jetzt den Link in der E-Mail und melde dich dann hier an.";
      render(); return;
    }
    case "myname": { const n = v("mn").trim(); if (!n) return; await sb.rpc("set_my_name", {p_name: n}); FR.name = n; toast("Gespeichert."); loadFriends(true); break; }
    case "addfriend": {
      const em = v("fe").trim(); const {data: r, error} = await sb.rpc("add_friend", {p_email: em});
      const m = {requested: "Anfrage gesendet. Sobald sie bestätigt ist, seht ihr eure Aktivitäten.", accepted: "Ihr seid jetzt befreundet.", invited: "Eingeladen. Sie kann sich jetzt mit dieser E-Mail-Adresse registrieren, danach seid ihr automatisch befreundet. Schick ihr einfach den Link zur App.", invalid: "Bitte eine gültige E-Mail-Adresse eingeben.", limit: "Du hast schon 20 offene Einladungen.", self: "Das ist deine eigene E-Mail-Adresse.", pending: "Die Anfrage läuft bereits."};
      toast(error ? "Das hat nicht geklappt." : (m[r] || "Ihr seid schon befreundet.")); if (!error && r !== "invalid") f.reset(); loadFriends(true); break;
    }
    case "checkin": { const k = f.dataset.date; const s = ciSel[k] || {}; if (!s.energy || !s.soreness) { toast("Wähle Energie und Muskelkater aus."); return; } const d = getDay(k); d.checkin = {energy: s.energy, soreness: s.soreness, at: new Date().toTimeString().slice(0, 5)}; delete ciSel[k]; saveDay(k, d); toast("Check-in gespeichert."); break; }
    case "settings": { saveCfg({kcal: num(v("gk")) || DEFAULTS.kcal, p: num(v("gp")) || DEFAULTS.p, c: num(v("gc")) || DEFAULTS.c, f: num(v("gf")) || DEFAULTS.f, goalType: v("gt") || "maintain", goalLo: num(v("gl")) || DEFAULTS.goalLo, goalHi: num(v("gl")) || DEFAULTS.goalLo, strengthPerWeek: num(v("gs")) || DEFAULTS.strengthPerWeek, sleepGoal: num(v("gsl")) || DEFAULTS.sleepGoal, showRIR: !!(f.querySelector("#grir") || {}).checked, morningTime: v("gm") || "", pushFriends: !!(f.querySelector("#gpf") || {}).checked}); toast("Gespeichert."); closeSheet(); break; }
  }
});

window.addEventListener("scroll", () => $("#top").classList.toggle("scrolled", window.scrollY > 4), {passive: true});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) { tab = h; render(); } });

render();
initStore();
initExtras();
})();
</script>
</body>
</html>
