<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fitness-Dashboard</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fitness">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F3F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E14" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" href="icon-192.png?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: App-Shell fürs iPhone. Kopfzeile mit Datum, eine Spalte Karten (ab 900px zwei), schwebende Tab-Leiste unten.
   Look: ruhig und modern, Violett→Türkis als Akzent (unisex). Makro-Farben wie Hantelscheiben: Protein rot, Kohlenhydrate gelb, Fett grün. */
:root{
  --bg:#F4F3F8; --surface:#FFFFFF; --surface-2:#F1F0F6; --ink:#16151F; --ink-2:#4A4858; --muted:#77748A; --line:#E4E2EC;
  --accent:#5B47E0; --accent-2:#14B8A6; --accent-ink:#FFFFFF; --accent-soft:#ECE9FD;
  --grad:linear-gradient(135deg,#6D5BF0 0%,#4F7CF5 55%,#18B9B0 100%);
  --p:#EF5A50; --c:#EAA514; --f:#21A87D;
  --good:#12925F; --warn:#B26A00; --bad:#D9443A;
  --shadow:0 1px 2px rgba(22,21,31,.04),0 6px 20px rgba(60,50,120,.07);
  --display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0E14; --surface:#17171F; --surface-2:#20202A; --ink:#EEEDF5; --ink-2:#B9B7C8; --muted:#8A879C; --line:#2A2935;
  --accent:#A194FF; --accent-2:#3DD9C5; --accent-ink:#0E0E14; --accent-soft:#25223F;
  --grad:linear-gradient(135deg,#8B7BFF 0%,#6C93FF 55%,#34D4C4 100%);
  --p:#FF7A6E; --c:#F6C04A; --f:#45D19F;
  --good:#4FD69A; --warn:#F2AE4C; --bad:#FF7A6E;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E0E14; --surface:#17171F; --surface-2:#20202A; --ink:#EEEDF5; --ink-2:#B9B7C8; --muted:#8A879C; --line:#2A2935;
  --accent:#A194FF; --accent-2:#3DD9C5; --accent-ink:#0E0E14; --accent-soft:#25223F;
  --grad:linear-gradient(135deg,#8B7BFF 0%,#6C93FF 55%,#34D4C4 100%);
  --p:#FF7A6E; --c:#F6C04A; --f:#45D19F;
  --good:#4FD69A; --warn:#F2AE4C; --bad:#FF7A6E;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,select,textarea,label{touch-action:manipulation}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.app{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);display:flex;align-items:center;gap:8px;padding-block:12px 10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top h1{font-size:clamp(19px,5.6vw,24px);line-height:1.1;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.iconbtn{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:active{transform:scale(.96)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Tab-Leiste */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;max-width:560px;margin:0 auto;background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border:1px solid var(--line);border-radius:24px;box-shadow:0 8px 30px rgba(20,16,50,.14)}
.tabs nav{display:grid;grid-template-columns:repeat(6,1fr);padding:6px}
.tabs button{background:none;border:0;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;min-width:0;font-weight:600;cursor:pointer;border-radius:18px;transition:background .2s,color .2s}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* Karten */
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:900px){.grid.two{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .card{border-color:transparent}}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-h h2{font-size:20px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stack{display:flex;flex-direction:column;gap:10px}
.big{font-family:var(--display);font-size:42px;font-weight:700;letter-spacing:-.02em;line-height:.95;font-variant-numeric:tabular-nums}
.mid{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.unit{font-family:var(--body);font-size:14px;font-weight:500;color:var(--muted);margin-left:3px}
.section-title{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px}

/* Buttons & Felder */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;transition:transform .12s,filter .15s;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:600;font-size:14.5px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn:active:not(:disabled){transform:scale(.98)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.inp{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 11px;font-size:16px;min-height:42px}
.inp:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{min-height:84px;resize:vertical}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:7px 10px;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Fortschrittsbalken */
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .5s ease}
.bar.over i{background:var(--bad)}
.macro{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:10px;font-size:14px}
.macro .lbl{display:flex;align-items:center;gap:7px;font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.macro.m2{grid-template-columns:1fr auto;row-gap:6px;column-gap:8px}
.macro.m2 .bar{grid-column:1/-1;grid-row:2}
.macro.m2 .num{white-space:nowrap}

/* Listen */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .title{font-weight:500;overflow-wrap:anywhere}
.li .sub{font-size:13px;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;flex:none;font-size:18px;line-height:1}
.x:hover{background:var(--surface-2);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.good{color:var(--good)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)} .chip.acc{color:var(--accent);background:var(--accent-soft);border-color:transparent}

/* Supplements */
.supp{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2);cursor:pointer;text-align:left;width:100%}
.supp .chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface)}
.supp[aria-pressed="true"]{border-color:var(--good)}
.supp[aria-pressed="true"] .chk{background:var(--good);border-color:var(--good)}
.supp .chk svg{width:14px;height:14px;stroke:var(--surface);stroke-width:3;fill:none;opacity:0}
.supp[aria-pressed="true"] .chk svg{opacity:1}
.supp .t{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);margin-left:auto}
.adh{display:grid;gap:3px;font-size:11px;overflow-x:auto}
.adh .c{width:100%;aspect-ratio:1;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);min-width:14px}
.adh .c.on{background:var(--good);border-color:var(--good)}

/* Kalender */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:2px;letter-spacing:.04em}
.cal button{aspect-ratio:1;max-width:100%;border:1px solid transparent;background:var(--surface-2);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-variant-numeric:tabular-nums;font-size:14px;padding:0}
.cal button.out{opacity:.35}
.cal button.today{border-color:var(--accent);color:var(--accent);font-weight:700}
.cal button[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent}
.cal .marks{display:flex;gap:3px;height:7px}
.cal .m{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.cal .m.plan{background:transparent;border:1.5px solid var(--accent)}
.cal .m.act{background:var(--c)}
.cal button[aria-pressed="true"] .m{background:#fff}
.cal button[aria-pressed="true"] .m.plan{background:transparent;border-color:#fff}

/* Training-Session */
.ex{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--surface)}
.ex + .ex{margin-top:10px}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:6px;align-items:center;margin-top:8px}
.sets .h{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.sets .idx{font-weight:600;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.sets .inp{text-align:center;padding:7px 4px;min-height:40px}
.tick{height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer;display:grid;place-items:center}
.tick svg{width:18px;height:18px;stroke:var(--muted);stroke-width:2.6;fill:none}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.tick[aria-pressed="true"] svg{stroke:var(--surface)}
.hint{font-size:13px;border-radius:12px;padding:9px 12px;background:var(--accent-soft);color:var(--ink)}
.hint.good{background:color-mix(in srgb,var(--good) 14%,var(--surface))}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,8,24,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94%;border-radius:26px 26px 0 0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:88%}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.sheet-h h2{font-size:22px;font-weight:700;flex:1;min-width:0}
.sheet-b{overflow-y:auto;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
.sheet-f{padding:10px 16px 12px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--bg)}

/* Diagramme */
.chart{position:relative;width:100%;min-height:60px}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 9px;font-size:12.5px;line-height:1.35;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-10px;z-index:3;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ln{width:16px;height:2px;background:var(--accent);display:inline-block}

.banner{background:var(--accent-soft);border-radius:16px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.empty{text-align:center;padding:18px 8px;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.kv > div{min-width:0}
.kv .v{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.searchres{max-height:300px;overflow-y:auto}
.rec{display:flex;flex-direction:column;gap:14px}
.quote{margin:0;padding:2px 2px 12px;border-bottom:1px solid var(--line)}
.quote blockquote{margin:0;font-family:var(--display);font-size:20px;font-weight:500;letter-spacing:-.01em;line-height:1.25;text-wrap:balance}
.quote blockquote::before{content:"„"}.quote blockquote::after{content:"“"}
.quote figcaption{margin-top:6px;font-size:13px;color:var(--muted);font-weight:500}
.quote figcaption::before{content:"– "}
.dials{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.dialw{min-width:0}
.dial{position:relative;width:100%;max-width:132px;aspect-ratio:1;margin:0 auto}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .in{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;padding-top:34%}
.dial .dv{font-family:var(--display);font-size:clamp(22px,7vw,34px);font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.dial .du{font-size:13px;color:var(--muted);font-weight:600;margin-left:2px}
.dl{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.ds{font-size:12px;color:var(--muted);line-height:1.25}
.checkin{background:var(--surface-2);border-radius:16px;padding:12px;border:1px solid var(--line)}
.checkin .seg{background:var(--surface)}
.checkin .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tips .li{padding:9px 0}
.restbar{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;margin:14px -16px -20px;padding:12px 16px;background:var(--surface);border-top:3px solid var(--accent);box-shadow:0 -4px 16px rgba(0,0,0,.12)}
.av{width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;flex:none}
.av.sm{width:22px;height:22px;font-size:12px}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:64px;height:64px;font-size:28px}
.feed{margin-bottom:12px}
.fhead{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.ftitle{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px}
.kudos{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}
.kudos[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.plancat{font-family:var(--display);font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:12px 0 4px}
.planitem{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:10px 12px;cursor:pointer;margin-top:6px}
.planitem .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface);margin-top:1px}
.planitem .chk svg{width:13px;height:13px;stroke:var(--surface);stroke-width:3;fill:none;opacity:0}
.planitem[aria-pressed="true"]{border-color:var(--good)}
.planitem[aria-pressed="true"] .chk{background:var(--good);border-color:var(--good)}
.planitem[aria-pressed="true"] .chk svg{opacity:1}
.planitem[aria-pressed="true"] b{text-decoration:line-through;text-decoration-color:var(--muted)}
/* Übungs-Animation: Start- und Endposition im Wechsel */
a.btn{color:var(--accent)}
.exanim{position:relative;display:block;overflow:hidden;border-radius:14px;background:#fff;flex:none;border:1px solid var(--line)}
.exanim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.exanim img.b{animation:exflip 1.8s steps(1) infinite}
@keyframes exflip{0%{opacity:0}50%{opacity:1}}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.steps li{padding-left:2px;line-height:1.45}
.steps li::marker{color:var(--accent);font-weight:700}

<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="view" aria-live="polite"></main>
</div>
<div class="tabs"><nav id="tabs" aria-label="Bereiche"></nav></div>
<div class="scrim" id="scrim" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";

/* Kein Zoomen: Pinch-Gesten und Doppeltipp-Zoom unterbinden (iOS ignoriert user-scalable allein). */
["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive: false}));
["touchstart", "touchmove"].forEach(t => window.addEventListener(t, e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, {passive: false, capture: true}));
const APP_VERSION = "05.10.2026 10:00";
/* Neue Version sofort laden statt bis zu 10 Minuten die zwischengespeicherte zu zeigen. */
async function checkUpdate(){
  if (APP_VERSION.startsWith("__")) return;
  try {
    const html = await (await fetch(location.pathname + "?check=" + Date.now(), {cache: "no-store"})).text();
    const m = html.match(/APP_VERSION = "([^"]+)"/);
    if (m && m[1] !== APP_VERSION && !m[1].startsWith("__")) location.replace(location.pathname + "?v=" + encodeURIComponent(m[1]));
  } catch(e) {}
}
checkUpdate();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
/* Doppeltipp-Zoom verhindert touch-action im CSS, ohne schnelle Tipps zu verschlucken. */

/* ---------- Hilfsfunktionen ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o ?? {}));
const pad = n => String(n).padStart(2, "0");
const keyOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const dateOf = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const diffDays = (a, b) => Math.round((dateOf(b) - dateOf(a)) / 864e5);
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const WDL = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const MON = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const fmt = (n, d = 0) => (n == null || isNaN(n)) ? "–" : Number(n).toLocaleString("de-DE", {minimumFractionDigits: d, maximumFractionDigits: d});
const num = v => { if (v == null || v === "") return NaN; return parseFloat(String(v).replace(",", ".")); };
const fmtLong = k => { const d = dateOf(k); return WDL[d.getDay()] + ", " + d.getDate() + ". " + MON[d.getMonth()]; };
const fmtShort = k => { const d = dateOf(k); return d.getDate() + "." + (d.getMonth() + 1) + "."; };
const fmtMid = k => { const d = dateOf(k); return WD[d.getDay()] + ", " + d.getDate() + ". " + MON[d.getMonth()].slice(0, 3) + "."; };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const relDay = k => { const t = todayKey(); if (k === t) return "Heute"; if (k === addDays(t, -1)) return "Gestern"; if (k === addDays(t, 1)) return "Morgen"; return null; };
const mondayOf = k => { const d = dateOf(k); const wd = (d.getDay() + 6) % 7; return addDays(k, -wd); };

const ICON = {
  heute:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  essen:'<svg viewBox="0 0 24 24"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10"/><path d="M17 21V3c-2.2 1.3-3.5 4-3.5 7.5 0 2 1.5 3.5 3.5 3.5"/></svg>',
  training:'<svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>',
  koerper:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8.5 10a5 5 0 0 1 7 0"/><path d="M12 10l1.5-2"/></svg>',
  freunde:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19.5c.6-3.3 3-5.2 6-5.2s5.4 1.9 6 5.2"/><circle cx="17" cy="9" r="2.6"/><path d="M16.2 14.4c2.5.2 4.3 1.9 4.8 4.6"/></svg>',
  routine:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
  gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  left:'<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  right:'<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>',
  close:'<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

const TABS = [["heute","Heute"],["essen","Essen"],["training","Training"],["freunde","Freunde"],["koerper","Körper"],["routine","Erholung"]];
const MEALS = [["fruehstueck","Frühstück"],["mittag","Mittagessen"],["abend","Abendessen"],["snack","Snacks"]];
const GROUPS = ["Brust","Rücken","Schultern","Bizeps","Trizeps","Beine","Waden","Bauch","Sonstiges"];
const ACTIVITIES = ["Fußball","Laufen","Rennrad","Spazieren","Tennis"];
const GOALS = {cut: "Abnehmen (Cut)", bulk: "Muskeln aufbauen", maintain: "Gewicht halten"};
const showRIR = () => false; // RIR-Anzeige entfernt (Mario braucht sie nicht)
const goalType = () => GOALS[cfg().goalType] ? cfg().goalType : "maintain";
const DEFAULTS = {kcal: 2400, p: 180, f: 70, c: 260, goalLo: 81, goalHi: 81, rateLo: 0.4, rateHi: 0.6, sleepGoal: 7.5, strengthPerWeek: 3, supplements: []};

/* ---------- Datenspeicher (Supabase) ---------- */
const SB_URL = "https://vmrbhvigsvemuntqeedp.supabase.co", SB_KEY = "sb_publishable_fHBe4Fo9FlF4xMu7Nzt9NA_8YoRC6m6";
const COLS = ["days","foods","exercises","templates","workouts","settings"];
const S = {}; COLS.forEach(c => S[c] = {});
let mode = "loading", sb = null, user = null, loaded = false;
const chains = {};

function writeErr(e){ console.error(e); toast("Speichern hat nicht geklappt. Prüfe deine Internetverbindung."); }
function queue(k, fn){ chains[k] = (chains[k] || Promise.resolve()).then(fn).then(r => { if (r && r.error) writeErr(r.error); }).catch(writeErr); return chains[k]; }
function put(col, id, data){
  S[col] = Object.assign({}, S[col], {[id]: data});
  scheduleRender();
  if (mode !== "db") return Promise.resolve();
  return queue(col + "/" + id, () => sb.from("docs").upsert({user_id: user.id, col, id, data, updated_at: new Date().toISOString()}));
}
function del(col, id){
  const o = Object.assign({}, S[col]); delete o[id]; S[col] = o;
  scheduleRender();
  if (mode !== "db") return Promise.resolve();
  return queue(col + "/" + id, () => sb.from("docs").delete().match({user_id: user.id, col, id}));
}
const cfgRaw = () => Object.assign({}, DEFAULTS, S.settings.main || {});
const cfg = () => { const c = cfgRaw(); if (c.calc && c.calc.on) { const a = autoTargets(); if (a) Object.assign(c, {kcal: a.kcal, p: a.p, f: a.f, c: a.c}); } return c; };
const saveCfg = patch => put("settings", "main", Object.assign(clone(S.settings.main), patch));
const getDay = k => clone(S.days[k]);
const saveDay = (k, d) => put("days", k, d);

let loading = null;
async function loadAll(){
  if (loading) return loading;
  loading = (async () => {
    await Promise.all(Object.values(chains));
    const fresh = {}; COLS.forEach(c => fresh[c] = {});
    for (let from = 0; ; from += 1000) {
      const {data, error} = await sb.from("docs").select("col,id,data").range(from, from + 999);
      if (error) { toast("Daten konnten nicht geladen werden. Prüfe deine Internetverbindung."); return; }
      data.forEach(r => { if (fresh[r.col]) fresh[r.col][r.id] = r.data; });
      if (data.length < 1000) break;
    }
    COLS.forEach(c => S[c] = fresh[c]);
    try { localStorage.setItem("fd-cache", JSON.stringify(S)); } catch(e) {}
    loaded = true; scheduleRender();
  })().finally(() => { loading = null; });
  return loading;
}
async function initStore(){
  if (!window.supabase) { mode = "auth"; render(); toast("Keine Internetverbindung."); return; }
  sb = sb || window.supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}});
  const {data: {session}} = await sb.auth.getSession();
  if (!session) { mode = "auth"; render(); return; }
  user = session.user; mode = "db";
  sb.rpc("am_owner").then(({data}) => { isOwner = !!data; scheduleRender(); });
  loadGarminStatus();
  try { const raw = localStorage.getItem("fd-cache"); if (raw) { const o = JSON.parse(raw); COLS.forEach(c => S[c] = o[c] || {}); loaded = true; render(); } } catch(e) {}
  await loadAll();
  initPush();
  if (COLS.every(c => !Object.keys(S[c]).length)) {
    const {data: n} = await sb.rpc("import_seed");
    if (n > 0) { toast(n + " Einträge aus deinem bisherigen Dashboard übernommen."); await loadAll(); }
  }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && mode === "db") loadAll(); });

/* Claude-Funktionen gibt es nur auf claude.ai. */
let sampleFn = null, sampleImages = null;
async function initExtras(){ loadExdb(); }

/* ---------- Übungsdatenbank (Free Exercise DB, gemeinfrei; deutsche Texte selbst geschrieben) ---------- */
const EXIMG = "https://cdn.jsdelivr.net/gh/yuhonas/free-exercise-db@main/exercises/";
let EXDB = null, EXDBI = {};
async function loadExdb(){
  if (EXDB) return EXDB;
  try { EXDB = await fetch("exdb.json?v=" + encodeURIComponent(APP_VERSION)).then(r => r.json()); EXDBI = {}; EXDB.forEach(x => EXDBI[x.id] = x); scheduleRender(); }
  catch(e) { EXDB = null; }
  return EXDB;
}
const exRef = id => { const e = S.exercises[id]; return e && e.ref ? EXDBI[e.ref] : null; };
function exAnim(x, size){
  if (!x || !x.img || !x.img.length) return "";
  const [a, b] = x.img;
  return `<span class="exanim" style="width:${size};aspect-ratio:${size === "100%" ? "4/3" : "1"}" aria-hidden="true"><img src="${EXIMG + esc(a)}" alt="" loading="lazy">${b ? `<img class="b" src="${EXIMG + esc(b)}" alt="" loading="lazy">` : ""}</span>`;
}
const ytLink = name => "https://www.youtube.com/results?search_query=" + encodeURIComponent(name.replace(/\s*\(.*?\)/g, "") + " richtige Ausführung");
/* Empfehlung für Sätze/Wiederholungen nach den Quellen (nur Info, ändert keinen Plan):
   10–20 harte Sätze pro Muskelgruppe und Woche, Sätze 1–3 Wdh. vor dem Versagen (RIR 1–3), Wiederholungsbereich frei (ca. 4–30),
   schwere Sätze (3–5 Wdh.) mit 3–5 min Pause; Hessmann: Muskelaufbau mit ca. 60–70 % der Maximalkraft. */
function trainingXp(){
  const c = cfgRaw(), n = workoutsSorted().filter(w => w.status === "done" && w.kind !== "activity").length;
  return c.experience && c.experience !== "auto" ? c.experience : n >= 40 ? "advanced" : n >= 12 ? "intermediate" : "beginner";
}
/* Wochenziel an Sätzen für eine Muskelgruppe: Erfahrung, Ziel, Kalorien-Tempo, Erholung und Fußball */
function groupTarget(g){
  const c = cfgRaw(), gt = goalType(), xp = trainingXp(), today = todayKey(), notes = [];
  const small = g === "Waden" || g === "Bauch", arm = g === "Bizeps" || g === "Trizeps";
  const base = xp === "beginner" ? 10 : xp === "intermediate" ? 12 : 14;
  let v = small ? 6 : arm ? base - 4 : base + (gt === "bulk" ? 2 : gt === "cut" ? 0 : -1);
  const pace = c.calc && c.calc.on ? num(c.calc.pace) : 0;
  if (gt === "cut" && pace <= -750) { v -= 2; notes.push("großes Kaloriendefizit, daher etwas weniger Sätze"); }
  const recs = [0, 1, 2, 3, 4, 5, 6].map(i => recoveryOf(addDays(today, -i))).filter(Boolean).map(r => r.score);
  const recAvg = recs.length >= 3 ? recs.reduce((a, b) => a + b, 0) / recs.length : null;
  if (recAvg != null && recAvg < 50) { v -= 2; notes.push("Erholung zuletzt niedrig (Ø " + Math.round(recAvg) + " %)"); }
  const football = workoutsSorted().filter(w => w.status === "done" && w.kind === "activity" && w.date >= addDays(today, -28) && /fu(ss|ß)ball|soccer/i.test(w.title || "")).length;
  if (g === "Beine" && football >= 3) { v -= 2; notes.push("Fußball belastet die Beine schon"); }
  v = small ? clamp(v, 4, 12) : arm ? clamp(v, 6, 14) : clamp(v, 8, 20);
  if (recAvg != null && recAvg < 38) { v = Math.round(v * 0.6); notes.push("Entlastung: Erholung sehr niedrig"); }
  return {v, notes, recAvg};
}
/* Was deine eigenen Pläne pro Woche für eine Muskelgruppe vorsehen */
function plannedSets(g){
  let sets = 0, n = 0;
  templatesSorted().filter(t => !t.coach).forEach(t => (t.items || []).forEach(it => { const e = S.exercises[it.exId]; if (e && (e.group || "") === g) { sets += num(it.sets) || 0; n++; } }));
  return {sets, n};
}
/* Empfehlung für eine Übung in deinem Plan (nur Info) */
function dynRec(x, ownId){
  const gt = goalType(), xp = trainingXp(), sc = coachScheme(x, gt, xp), g = x.g;
  const tg = groupTarget(g), pl = plannedSets(g), small = g === "Bauch" || g === "Waden";
  const sets = clamp(Math.round(tg.v / Math.max(pl.n, 1)), 2, small ? 3 : 4);
  const c = cfgRaw(), pace = c.calc && c.calc.on ? num(c.calc.pace) : 0;
  const diet = gt === "cut" ? `Im Defizit (${pace ? pace + " kcal" : "Abnehmen"}): Gewichte halten ist wichtiger als mehr Sätze, schwer genug bleiben.`
    : gt === "bulk" ? `Im Überschuss (${pace ? "+" + pace + " kcal" : "Aufbau"}): gute Phase, um Gewicht und Wiederholungen zu steigern.`
    : "Kalorien im Gleichgewicht: Gewichte langsam steigern.";
  return {sets, reps: sc.reps, rir: sc.rir, rest: sc.rest, target: tg.v, planned: pl.sets, notes: tg.notes, diet, g};
}
function recBox(x, ownId){
  if (!x || !autoOn()) return "";
  const r = dynRec(x, ownId), wk = weekSummary(todayKey()), done = wk.groups[r.g] || 0;
  const plan = ownId ? templatesSorted().filter(t => !t.coach).flatMap(t => (t.items || []).filter(it => it.exId === ownId).map(it => ({t: t.short || t.name, it}))) : [];
  return `<div class="hint" style="margin-top:12px"><b>Empfehlung für dich</b> (${esc(GOALS[goalType()])}, nur Info)
    <div class="num" style="margin-top:4px">${r.sets} Sätze × ${esc(r.reps)} Wdh. · Pause ${esc(r.rest)}</div>
    <div class="small ink2" style="margin-top:4px">${esc(r.diet)}</div>
    ${r.g !== "Sonstiges" ? `<div class="small ink2" style="margin-top:4px">${esc(r.g)}: Ziel ${r.target} harte Sätze pro Woche${r.notes.length ? " (" + esc(r.notes.join(", ")) + ")" : ""}. Deine Pläne: ${r.planned}, diese Woche gemacht: ${done}.</div>` : ""}
    ${plan.length ? `<div class="small muted" style="margin-top:4px">Dein Plan: ${plan.map(p => esc(p.t) + " " + esc(p.it.sets || "?") + " × " + esc(p.it.reps || "?")).join(" · ")}</div>` : ""}
  </div>`;
}
/* Kurze Zeile unter jeder Übung in deinen Plänen */
function planRecLine(it){
  if (!autoOn()) return "";
  const e = S.exercises[it.exId], x = e && e.ref ? EXDBI[e.ref] : null; if (!x) return "";
  const r = dynRec(x, it.exId), diff = (num(it.sets) || 0) - r.sets;
  return `<div class="small" style="color:var(--accent);margin-top:2px">Empfehlung: ${r.sets} × ${esc(r.reps)}${diff >= 2 ? " · eher weniger Sätze" : diff <= -2 ? " · eher mehr Sätze" : ""}</div>`;
}
function exGuide(x, ownId){
  if (!x) return "";
  return `${exAnim(x, "100%")}${recBox(x, ownId)}
    <div class="row" style="margin:10px 0 4px">${(x.pm || []).map(m => `<span class="chip acc">${esc(m)}</span>`).join("")}${(x.sm || []).map(m => `<span class="chip">${esc(m)}</span>`).join("")}</div>
    <div class="section-title" style="margin-top:12px">So geht's</div>
    <ol class="steps">${x.s.map(t => `<li>${esc(t)}</li>`).join("")}</ol>
    <a class="btn" style="margin-top:12px;text-decoration:none" href="${ytLink(x.n)}" target="_blank" rel="noopener">▶ Video auf YouTube ansehen</a>
    <p class="small muted" style="margin:8px 0 0">Bilder: Free Exercise DB (gemeinfrei).</p>`;
}
let exdbQ = "", exdbG = "";
function exdbList(){
  if (!EXDB) { loadExdb().then(() => { if ($("#exdbres")) $("#exdbres").innerHTML = exdbList(); }); return '<div class="empty">Datenbank wird geladen …</div>'; }
  const q = normT(exdbQ), mine = new Set(Object.values(S.exercises).map(e => e.ref).filter(Boolean));
  const res = EXDB.filter(x => (!exdbG || x.g === exdbG) && (!q || normT(x.n + " " + x.en + " " + x.e).includes(q)));
  return res.slice(0, 80).map(x => `<button class="pick" data-act="exdb-open" data-id="${esc(x.id)}">${exAnim(x, "52px")}<span style="flex:1;min-width:0"><span style="display:block;font-weight:500">${esc(x.n)}</span><span class="small muted">${esc(x.g)} · ${esc(x.e)}</span></span>${mine.has(x.id) ? '<span class="chip good">Meine</span>' : ""}</button>`).join("") || '<div class="empty">Nichts gefunden.</div>';
}
function openExdb(){
  openSheet("Übungsdatenbank", `<input class="inp" id="exdbq" placeholder="Suchen, z. B. Rudern oder Kurzhantel" value="${esc(exdbQ)}" autocomplete="off">
    <div class="filt">${["", ...GROUPS].map(g => `<button data-act="exdb-g" data-g="${g}" aria-pressed="${exdbG === g}">${g || "Alle"}</button>`).join("")}</div>
    <div class="list" id="exdbres">${exdbList()}</div>`);
}
function openExdbItem(rid){
  const x = EXDBI[rid]; if (!x) return;
  const mineId = Object.keys(S.exercises).find(k => S.exercises[k].ref === rid);
  openSheet(x.n, `<div class="row" style="margin-bottom:10px"><span class="chip">${esc(x.g)}</span><span class="chip">${esc(x.e)}</span>${x.l ? `<span class="chip">${esc(x.l)}</span>` : ""}</div>${exGuide(x)}`,
    mineId ? `<button class="btn" data-act="open-ex" data-id="${mineId}">In deinen Übungen öffnen</button><button class="btn ghost" data-act="exdb-back">Zurück</button>`
           : `<button class="btn primary" data-act="exdb-add" data-id="${esc(rid)}">Zu meinen Übungen hinzufügen</button><button class="btn ghost" data-act="exdb-back">Zurück</button>`);
}

/* ---------- Berechnungen ---------- */
function dayTotals(d){
  const t = {kcal: 0, p: 0, f: 0, c: 0};
  if (!d || !d.meals) return t;
  MEALS.forEach(([m]) => (d.meals[m] || []).forEach(it => { t.kcal += +it.kcal || 0; t.p += +it.p || 0; t.f += +it.f || 0; t.c += +it.c || 0; }));
  return t;
}
function weightSeries(){
  return Object.keys(S.days).filter(k => typeof S.days[k].weight === "number").sort().map(k => ({k, v: S.days[k].weight}));
}
function avgAt(series, k, win = 7){
  const from = addDays(k, -(win - 1));
  const xs = series.filter(p => p.k >= from && p.k <= k).map(p => p.v);

/* ---------- Trainings-Empfehlungen (Teil der Automatik „Ernährung & Training“) ----------
   Regelbasiert und kostenlos. Quellen: 10–20 harte Sätze pro Muskelgruppe und Woche, RIR 1–3, freie Wiederholungsbereiche,
   3–5 min Pause bei schweren Sätzen; Hessmann: Muskelaufbau mit ca. 60–70 % der Maximalkraft, 24 h Pause für gleiche Muskeln.
   Ändert nie einen Plan, zeigt nur Empfehlungen zu deinen eigenen Übungen. */
const EXPERIENCE = [["auto", "Automatisch aus meinen Trainings"], ["beginner", "Einsteiger"], ["intermediate", "Fortgeschritten"], ["advanced", "Erfahren"]];
/* Schwierigkeit einer Übung: geführte Maschinen/Kabel leicht, Kurzhanteln mittel, Langhantel-Grundübungen und Klimmzüge/Dips anspruchsvoll */
function exDifficulty(x){
  let d = x.e === "Maschine" || x.e === "Smith Machine" || x.e === "Kabelzug" ? 1 : x.e === "Kurzhanteln" || x.e === "SZ-Stange" || x.e === "Kettlebell" ? 2 : x.e === "Langhantel" ? 3 : 1.5;
  if (x.mc !== "c") d = Math.min(d, 1.5);
  if (/Pullups|Chin-Up|Dips_|Hanging|Front_Squat|Barbell_Deadlift|Glute_Ham|Pistol/.test(x.id)) d = 3;
  if (/Band_Assisted|Incline_Push-Up|Bodyweight_Squat|Goblet/.test(x.id)) d = 1;
  if (x.l === "Fortgeschritten") d += 0.3; if (x.l === "Profi") d += 0.8;
  return d;
}
const autoOn = () => { const c = cfgRaw(); return !!(c.calc && c.calc.on); };
/* Wiederholungen, RIR und Pause je Übung nach Ziel und Erfahrung */
function coachScheme(x, gt, xp){
  if (xp === "beginner" && x.g !== "Bauch" && x.g !== "Waden") return x.mc === "c" ? {reps: "8–12", rir: "2–3", rest: "2 min"} : {reps: "12–15", rir: "1–2", rest: "1,5 min"};
  if (xp === "advanced" && x.mc === "c" && exDifficulty(x) >= 2.8 && !x.bw) return {reps: "5–8", rir: "1–2", rest: "3 min"};
  if (x.g === "Bauch") return /Plank/.test(x.id) ? {reps: "30–60 s", rir: "–", rest: "1 min"} : {reps: "10–15", rir: "1–2", rest: "1 min"};
  if (x.g === "Waden") return {reps: "10–15", rir: "1–2", rest: "1,5 min"};
  if (x.mc === "c" && x.bw) return {reps: "6–12", rir: "1–3", rest: "2–3 min"};
  if (x.mc === "c") return gt === "cut" ? {reps: "6–10", rir: "1–2", rest: "2–3 min"} : {reps: "6–12", rir: "1–2", rest: "2–3 min"};
  return {reps: "10–15", rir: "0–2", rest: "1,5 min"};
}
/* Gewichtsvorschlag nach doppelter Progression: alle Sätze am oberen Ende → mehr Gewicht, sonst gleiches Gewicht, mehr Wdh. */
function weightSuggestion(exId, target, date, wid){
  const last = lastPerformance(exId, date, wid); if (!last || !target) return "";
  const hi = repHi(target.reps); const ws = last.sets.map(s => num(s.w) || 0); const top = Math.max(...ws);
  if (!(top > 0) || !hi) return "";
  const rx = exRef(exId), comp = rx ? rx.mc === "c" : true;
  const all = last.sets.filter(s => (num(s.w) || 0) >= top).every(s => num(s.r) >= hi);
  const next = all ? Math.round((top + (comp ? 2.5 : 1.25)) * 4) / 4 : top;
  return `<div class="small num" style="margin-top:2px;color:var(--accent);font-weight:600">Vorschlag heute: ${fmtKg(next)} kg × ${esc(target.reps)}${all ? " (Gewicht rauf)" : " (gleiches Gewicht, mehr Wdh.)"}</div>`;
}
/* Tagesform: aus der heutigen Erholung */
function dayFormHint(w){
  if (!autoOn() || !w || w.date !== todayKey() || w.status === "done") return "";
  const r = recoveryOf(w.date); if (!r) return "";
  const z = zoneOf(r.score);
  if (z === "bad") return `<div class="hint" style="margin-bottom:12px;border:1.5px solid var(--warn)"><b>Tagesform niedrig (Erholung ${r.score} %):</b> Mach heute pro Übung einen Satz weniger und hör 3 Wdh. vor dem Versagen auf.</div>`;
  if (z === "good") return `<div class="hint good" style="margin-bottom:12px"><b>Gut erholt (${r.score} %):</b> Guter Tag, um bei den Übungen mit „Gewicht rauf“ zu steigern.</div>`;
  return `<div class="hint" style="margin-bottom:12px"><b>Erholung ${r.score} %:</b> Normal trainieren, Gewichte halten oder leicht steigern.</div>`;
}

/* ---------- Auswertung pro Einheit ----------
   Was hat die Einheit gebracht, wofür war sie gut, wie regenerieren. Grundlage: Garmin-Pulszonen und Trainingseffekt,
   Quellen: Zone 2 stärkt die Grundlagenausdauer, intensive Reize verbessern die VO2max (wichtigster Langlebigkeitswert),
   Fettverlust hängt an der Kalorienbilanz, nicht am Nüchtern- oder Fettstoffwechsel-Training; Hessmann: nach dem Sport zuerst
   trinken (Verlust × 1,5), nach ca. 1 h Kohlenhydrate + Eiweiß, 24 h Pause für gleiche Muskeln; statisch dehnen 30–60 s nach dem Sport. */
const ZONES = [["Z1", "Erholung"], ["Z2", "Grundlage"], ["Z3", "Aerob"], ["Z4", "Schwelle"], ["Z5", "Maximal"]];
const ZONE_COL = ["#9AD8F5", "#38BDF8", "#4F7CF5", "#7563F2", "#C2367A"];
const teWord = v => v == null ? "–" : v < 1 ? "kein Effekt" : v < 2 ? "gering" : v < 3 ? "erhaltend" : v < 4 ? "verbessernd" : v < 5 ? "stark verbessernd" : "Überlastung";
function actKind(w){
  const t = normT((w.title || "") + " " + (w.garminType || ""));
  return /fussball|soccer/.test(t) ? "fussball" : /lauf|run|jogg/.test(t) ? "lauf" : /rad|bike|cycl/.test(t) ? "rad" : /wander|hik/.test(t) ? "wandern" : /spazier|walk/.test(t) ? "gehen" : /schwimm|swim/.test(t) ? "schwimmen" : /tennis|padel|squash/.test(t) ? "tennis" : "sport";
}
function actLoad(w){
  const z = w.zones || [], hard = (z[3] || 0) + (z[4] || 0), m = num(w.minutes) || 0;
  const te = num(w.teAer) || 0, ta = num(w.teAna) || 0;
  if (te >= 3.5 || ta >= 3 || hard >= 20 || (m >= 100 && te >= 2.5)) return "hoch";
  if (te >= 2 || ta >= 1.5 || hard >= 5 || m >= 60) return "mittel";
  return "niedrig";
}
function evalActivity(w){
  const z = (w.zones || []).map(v => num(v) || 0), m = num(w.minutes) || 0, inZ = z.reduce((a, b) => a + b, 0);
  const hasZ = Array.isArray(w.zones) && inZ > 0, below = hasZ ? Math.max(0, m - inZ) : 0, share = i => m ? z[i] / m : 0, hard = (z[3] || 0) + (z[4] || 0);

const VO2_NORMS = {m: [[20, [41.7, 45.4, 51.1, 55.2]], [30, [40.5, 44.0, 48.3, 52.5]], [40, [38.5, 42.4, 46.4, 50.4]], [50, [35.6, 39.2, 43.4, 48.2]]],

function vo2Class(v){
  const c = cfgRaw(), p = c.calc || {}, sex = p.sex === "w" ? "w" : "m", age = p.birth ? new Date().getFullYear() - num(p.birth) : 25;
  const row = VO2_NORMS[sex].filter(r => age >= r[0]).pop() || VO2_NORMS[sex][0], t = row[1];

function trendSvg(pts, o){

  const t0 = dateOf(pts[0].k).getTime(), t1 = dateOf(pts[pts.length - 1].k).getTime() || t0 + 1;

  const X = k => l + (W - l - r) * ((dateOf(k).getTime() - t0) / Math.max(1, t1 - t0)), Y = v => top + (H - top - bot) * (1 - (v - lo) / (hi - lo));

  [lo + (o.pad || 1), hi - (o.pad || 1)].forEach(v => svg += `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${l - 5}" y="${Y(v) + 3}" text-anchor="end" font-size="9.5" fill="var(--muted)">${fmt(v, o.dec || 0)}</text>`);
  const line = o.smooth ? pts.map((p, i) => ({k: p.k, v: pts.slice(Math.max(0, i - 6), i + 1).reduce((a, x) => a + x.v, 0) / Math.min(i + 1, 7)})) : pts;
  svg += `<path d="${line.map((p, i) => (i ? "L" : "M") + X(p.k).toFixed(1) + " " + Y(p.v).toFixed(1)).join("")}" fill="none" stroke="${o.color || "var(--accent)"}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (!o.smooth || pts.length < 40) pts.forEach(p => svg += `<g><title>${fmtShort(p.k)}: ${fmt(p.v, o.dec || 0)} ${o.unit || ""}</title><circle cx="${X(p.k)}" cy="${Y(p.v)}" r="${o.smooth ? 2.5 : 4}" fill="${o.color || "var(--accent)"}" stroke="var(--surface)" stroke-width="1.5"/></g>`);
  svg += `<text x="${l}" y="${H - 5}" font-size="10" fill="var(--muted)">${fmtShort(pts[0].k)}</text><text x="${W - r}" y="${H - 5}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtShort(pts[pts.length - 1].k)}</text>`;
  return svg + `</svg>`;
}

/* ---------- Plateau-Erkennung ----------
   Eine Übung stagniert, wenn das geschätzte Maximalgewicht der letzten 3 Wochen nicht über dem der 5 Wochen davor liegt. */
function plateaus(){
  const today = todayKey(), out = [];
  Object.keys(S.exercises).forEach(id => {
    const h = exHistory(id).filter(x => x.kind === "kg" && x.k >= addDays(today, -63));
    if (h.length < 4) return;
    const recent = h.filter(x => x.k >= addDays(today, -21)), older = h.filter(x => x.k < addDays(today, -21));
    if (!recent.length || older.length < 2) return;
    const rb = Math.max(...recent.map(x => x.v)), ob = Math.max(...older.map(x => x.v));
    if (rb > ob * 1.01) return;
    const best = h.reduce((a, x) => x.v > a.v ? x : a, h[0]), weeks = Math.max(3, Math.round(diffDays(best.k, today) / 7));
    const reps = recent[recent.length - 1].sets.map(s => num(s.r)).filter(Boolean), avgR = reps.length ? reps.reduce((a, b) => a + b, 0) / reps.length : 10;
    out.push({id, name: exName(id), weeks, avgR, best: rb, group: (S.exercises[id] || {}).group || ""});
  });
  return out.sort((a, b) => b.weeks - a.weeks);
}
function plateauTips(p){

  const e = S.exercises[p.id], x = e && e.ref ? EXDBI[e.ref] : null;
  if (x && EXDB) { const alt = EXDB.find(y => y.g === x.g && y.mc === x.mc && y.id !== x.id && !/Band|Bodyweight/.test(y.id) && Object.values(S.exercises).every(o => o.ref !== y.id)); if (alt) tips.push(`Variante tauschen, z. B. ${alt.n}, für 4–6 Wochen. Ein neuer Reiz bringt oft wieder Fortschritt.`); }
  const wk = weekSummary(todayKey()); if ((wk.groups[p.group] || 0) > 20) tips.push(`${p.group} bekommt über 20 Sätze pro Woche. Weniger kann hier mehr sein, oder eine Entlastungswoche.`);
  const recs = [1, 2, 3, 4, 5, 6, 7].map(i => recoveryOf(addDays(todayKey(), -i))).filter(Boolean); const ra = recs.length ? recs.reduce((a, r) => a + r.score, 0) / recs.length : null;
  if (ra != null && ra < 55) tips.push(`Deine Erholung lag zuletzt bei Ø ${Math.round(ra)} %. Mehr Schlaf bringt hier vermutlich mehr als mehr Training.`);
  const days = [1, 2, 3, 4, 5, 6, 7].map(i => dayTotals(S.days[addDays(todayKey(), -i)])).filter(t => t.kcal > 800); const pa = days.length ? days.reduce((a, t) => a + t.p, 0) / days.length : null;
  if (pa != null && pa < c.p * 0.85) tips.push(`Eiweiß lag zuletzt bei Ø ${fmt(pa)} g, Ziel ${c.p} g. Ohne genug Eiweiß wächst wenig.`);
  if (gt === "cut") tips.push("Im Kaloriendefizit ist es schon ein Erfolg, die Kraft zu halten. Echte Steigerungen kommen oft erst wieder im Aufbau.");

}

/* ---------- Persönliche Muster aus deinen Daten ----------

function insights(){
  const keys = Object.keys(S.days).sort().filter(k => k >= addDays(todayKey(), -120) && k < todayKey());
  const ws = workoutsSorted().filter(w => w.status === "done");
  const avg = xs => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
  const out = [];
  const nextSleep = k => { const sl = (S.days[addDays(k, 1)] || {}).sleep || {}; return num(sl.h) >= 3 ? sl : {}; };  // unplausible Nächte (< 3 h) ignorieren
  // 1) Abendsport und Schlaf
  const evening = new Set(ws.filter(w => w.start && new Date(w.start).getHours() >= 18).map(w => w.date));
  const a1 = keys.filter(k => evening.has(k)).map(k => nextSleep(k).h).filter(Boolean), b1 = keys.filter(k => !evening.has(k)).map(k => nextSleep(k).h).filter(Boolean);
  if (a1.length >= 4 && b1.length >= 4) { const d = (avg(a1) - avg(b1)) * 60; if (Math.abs(d) >= 15) out.push(["🌙", "Abendsport und Schlaf", `Nach Training am Abend (ab 18 Uhr) schläfst du im Schnitt ${fmt(Math.abs(d))} Minuten ${d < 0 ? "kürzer" : "länger"} als sonst.${d < 0 ? " Hilfreich: danach runterfahren, kühles Zimmer, kein Handy im Bett." : ""}`, `${a1.length} vs. ${b1.length} Nächte`, Math.abs(d) / 15]); }
  // 2) Harte Tage und HRV am Folgetag
  const hrvNext = k => num(((S.days[addDays(k, 1)] || {}).sleep || {}).hrv);
  const hardK = keys.filter(k => strainOf(k) >= 14), easyK = keys.filter(k => strainOf(k) < 8);
  const a2 = hardK.map(hrvNext).filter(v => v > 0), b2 = easyK.map(hrvNext).filter(v => v > 0);
  if (a2.length >= 4 && b2.length >= 4) { const d = avg(a2) - avg(b2); if (Math.abs(d) >= 3) out.push(["💓", "Belastung und HRV", `Nach harten Tagen liegt deine HRV am nächsten Morgen im Schnitt ${fmt(Math.abs(d))} ms ${d < 0 ? "niedriger" : "höher"} als nach lockeren Tagen.${d < 0 ? " Plan nach harten Tagen lieber etwas Lockeres ein." : ""}`, `${a2.length} vs. ${b2.length} Tage`, Math.abs(d) / 3]); }
  // 3) Schritte und Schlafwert

  if (a3.length >= 4 && b3.length >= 4) { const d = avg(a3) - avg(b3); if (Math.abs(d) >= 3) out.push(["👟", "Schritte und Schlaf", `An Tagen mit über 10.000 Schritten ist dein Schlafwert im Schnitt ${fmt(Math.abs(d))} Punkte ${d > 0 ? "besser" : "schlechter"} als an Tagen unter 6.000.`, `${a3.length} vs. ${b3.length} Nächte`, Math.abs(d) / 3]); }
  // 4) Wochenende und Kalorien
  const tracked = keys.filter(k => dayTotals(S.days[k]).kcal >= 1000), wkend = k => [0, 6].includes(dateOf(k).getDay());
  const a4 = tracked.filter(wkend).map(k => dayTotals(S.days[k]).kcal), b4 = tracked.filter(k => !wkend(k)).map(k => dayTotals(S.days[k]).kcal);
  if (a4.length >= 3 && b4.length >= 5) { const d = avg(a4) - avg(b4); if (Math.abs(d) >= 200) out.push(["🍕", "Wochenende und Essen", `Am Wochenende isst du im Schnitt ${fmt(Math.abs(d))} kcal ${d > 0 ? "mehr" : "weniger"} als unter der Woche.${d > 0 && goalType() === "cut" ? " Das bremst deinen Cut, plan dafür bewusst Spielraum ein." : ""}`, `${a4.length} vs. ${b4.length} Tage`, Math.abs(d) / 200]); }
  // 5) Kurzer Schlaf und Essen am Folgetag
  const shortN = tracked.filter(k => num(((S.days[k] || {}).sleep || {}).h) >= 3 && S.days[k].sleep.h < 6.5).map(k => dayTotals(S.days[k]).kcal), okN = tracked.filter(k => num(((S.days[k] || {}).sleep || {}).h) >= 7.5).map(k => dayTotals(S.days[k]).kcal);
  if (shortN.length >= 3 && okN.length >= 3) { const d = avg(shortN) - avg(okN); if (Math.abs(d) >= 200) out.push(["😴", "Wenig Schlaf und Hunger", `Nach Nächten unter 6,5 h isst du im Schnitt ${fmt(Math.abs(d))} kcal ${d > 0 ? "mehr" : "weniger"} als nach 7,5 h oder mehr.`, `${shortN.length} vs. ${okN.length} Tage`, Math.abs(d) / 200]); }
  // 6) Fußball und Erholung am Folgetag
  const fb = new Set(ws.filter(w => w.kind === "activity" && /fu(ss|ß)ball/i.test(w.title || "")).map(w => w.date));
  const recNext = k => { const r = recoveryOf(addDays(k, 1)); return r ? r.score : null; };
  const a6 = keys.filter(k => fb.has(k)).map(recNext).filter(v => v != null), b6 = keys.filter(k => !fb.has(k)).map(recNext).filter(v => v != null);
  if (a6.length >= 4 && b6.length >= 4) { const d = avg(a6) - avg(b6); if (Math.abs(d) >= 5) out.push(["⚽", "Fußball und Erholung", `Am Tag nach Fußball liegt deine Erholung im Schnitt bei ${Math.round(avg(a6))} %, sonst bei ${Math.round(avg(b6))} %.${d < 0 ? " Plan am Tag danach kein hartes Beintraining." : ""}`, `${a6.length} vs. ${b6.length} Tage`, Math.abs(d) / 5]); }
  return out.sort((a, b) => b[4] - a[4]);
}

/* ---------- Spieltags-Modus Fußball ----------
   Erkennt Trainings- und Spieltage aus deinen Garmin-Einheiten (oder deiner Einstellung) und gibt passende Tipps.
   Quellen: Spieltagsvorbereitung (Ronaldo/Lewandowski) und Hessmann. */
const WDN = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
function footballSchedule(){
  const st = cfgRaw().football || {};
  if (st.mode === "off") return {train: [], match: null, auto: false, off: true};
  if (st.mode === "manual") return {train: st.train || [], match: st.match == null ? null : st.match, auto: false};
  const since = addDays(todayKey(), -56), fb = workoutsSorted().filter(w => w.kind === "activity" && w.date >= since && /fu(ss|ß)ball|soccer/i.test(w.title || ""));
  const cnt = [0, 0, 0, 0, 0, 0, 0]; fb.forEach(w => cnt[dateOf(w.date).getDay()]++);
  const train = [1, 2, 3, 4, 5].filter(d => cnt[d] >= 3);

  const isTrain = d => pf(d) !== undefined ? pf(d) === "train" : planned.some(w => w.date === d && !/spiel/i.test(w.title || "")) || sch.train.includes(dateOf(d).getDay());

  if (isMatch(k)) return "match";

/* ---------- Wochenplaner ----------

  });

  renderPlanner();
}

}

function savePlanner(){
  const mon = wp.mon, days = wp.days, all = Object.assign({}, weekPlans());

  Object.keys(all).filter(m => m < addDays(mondayOf(todayKey()), -56)).forEach(m => delete all[m]);
  saveCfg({weekPlan: all});
  // Gym-Tage als geplante Trainings anlegen bzw. alte Planer-Einträge dieser Woche entfernen
  const end = addDays(mon, 6);
  workoutsSorted().filter(w => w.planner && w.status === "planned" && w.date >= mon && w.date <= end).forEach(w => { if (!days[w.date] || days[w.date].gym !== w.templateId) del("workouts", w.id); });

/* ---------- Essensplan nach Uhrzeit (Spieltag, Fußballtraining, Gym) ----------
   Quellen: Hessmann (ca. 3 h vorher kohlenhydratreich, fettarm, leicht; 30 Min. vorher etwas Schnelles; danach zuerst trinken,
   nach ca. 1 h Kohlenhydrate + Eiweiß), Spieltagsvorbereitung Ronaldo/Lewandowski (Frühstück, Powernap, Mittag 3 h vorher). */
const hm2min = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ""); return m ? +m[1] * 60 + +m[2] : null; };
const min2hm = m => { m = Math.max(0, Math.min(23 * 60 + 59, Math.round(m / 15) * 15)); return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
function dayPlanOf(k){ const p = weekPlanOf(mondayOf(k)); return p ? p[k] || null : null; }
function mealTimeline(k){
  const p = dayPlanOf(k); if (!p) return null;
  const ev = [];
  if (p.fb && hm2min(p.fbTime) != null) ev.push({type: p.fb, t: hm2min(p.fbTime), dur: p.fb === "match" ? 105 : 90});
  if (p.gym && hm2min(p.gymTime) != null) ev.push({type: "gym", t: hm2min(p.gymTime), dur: 75, name: (S.templates[p.gym] || {}).name || "Gym"});
  if (!ev.length) return null;
  ev.sort((a, b) => a.t - b.t);
  const items = [], add = (t, icon, title, text) => items.push({t, icon, title, text});
  const main = ev[0], late = e => e.t + e.dur >= 20 * 60 + 30;
  ev.forEach((e, i) => {
    const name = e.type === "match" ? "Spiel" : e.type === "train" ? "Fußballtraining" : e.name;
    if (e.type === "match") {
      if (e.t >= 13 * 60) add(Math.max(7.5 * 60, e.t - 6 * 60), "🍳", "Frühstück", "Eier, Vollkornbrot oder Haferflocken, Avocado und Obst wie Banane oder Beeren. Dazu viel Wasser.");
      if (e.t >= 14 * 60) add(e.t - 4 * 60, "😴", "Powernap 20–30 Min.", "Kurz hinlegen, das bringt Energie und Konzentration fürs Spiel.");
      add(e.t - 3 * 60, "🍝", e.t >= 13 * 60 ? "Mittagessen (letzte große Mahlzeit)" : "Frühstück als Hauptmahlzeit", "Kohlenhydratreich, fettarm und leicht verdaulich: Reis oder Nudeln mit Hähnchen und etwas Gemüse. Nichts Frittiertes, nicht zu viel Ballaststoffe.");
      add(e.t - 2 * 60, "💧", "Gut trinken", "Bis zum Anpfiff etwa 0,5 l Wasser oder Saftschorle in kleinen Schlucken.");
      add(e.t - 60, "🔥", "Aufwärmen und Fokus", "Dynamisch aufwärmen mit kurzen Sprints und Rumpfübungen, kurz das Spiel im Kopf durchgehen.");
      add(e.t - 30, "🍌", "Snack", "Etwas Schnelles wie eine Banane oder ein paar Schlucke Saft.");
      add(e.t, "🏆", "Anpfiff", "In den Pausen trinken, bevor Durst kommt.");
      add(e.t + e.dur + 15, "💧", "Zuerst trinken", "Gleich nach dem Spiel Wasser oder Saftschorle, gern mit einer Prise Salz.");
      add(e.t + e.dur + 75, "🍗", "Mahlzeit nach dem Spiel", `Eiweiß und Kohlenhydrate, z. B. Reis oder Kartoffeln mit Hähnchen oder Fisch.${late(e) ? " Am späten Abend lieber etwas Leichteres wie Skyr mit Obst und Haferflocken." : ""}`);
    } else if (e.type === "train") {
      if (!(i > 0 && e.t - ev[i - 1].t < 4 * 60)) add(e.t - 150, "🍝", "Mahlzeit vor dem Training", "Kohlenhydrate mit etwas Eiweiß und wenig Fett, z. B. Nudeln oder Reis mit Hähnchen oder ein Brot mit Putenbrust.");
      add(e.t - 30, "🍌", "Snack", "Eine Banane oder ein Müsliriegel für schnelle Energie.");
      add(e.t, "⚽", "Fußballtraining", "Gut getrunken starten und regelmäßig ein paar Schlucke nehmen.");
      add(e.t + e.dur + 45, "🍗", "Nach dem Training", `Zuerst trinken, dann Kohlenhydrate mit Eiweiß.${late(e) ? " Spät am Abend: Skyr oder Quark mit Obst und Haferflocken, das liegt nicht schwer im Magen." : " Z. B. Reis mit Hähnchen oder Kartoffeln mit Ei."}`);
    } else {
      if (!(i > 0 && e.t - ev[i - 1].t < 4 * 60)) add(e.t - 150, "🍽️", "Mahlzeit vor dem Gym", "Kohlenhydrate und Eiweiß, wenig Fett, z. B. Haferflocken mit Skyr und Banane oder Reis mit Hähnchen.");
      add(e.t - 45, "🍌", "Kleiner Snack (optional)", "Wenn die letzte Mahlzeit länger her ist: eine Banane oder ein Riegel.");
      add(e.t, "🏋️", name, "Während des Trainings Wasser trinken.");
      add(e.t + e.dur + 45, "🥩", "Nach dem Gym", `Mindestens 30 g Eiweiß mit Kohlenhydraten.${late(e) ? " Am späten Abend z. B. Skyr oder Magerquark mit Obst." : " Z. B. Reis mit Hähnchen, Skyr-Bowl oder Kartoffeln mit Ei."}`);
    }
  });
  if (ev.length > 1) { const a = ev[0], b = ev[1]; if (b.t - (a.t + a.dur) < 3 * 60) add(a.t + a.dur + 5, "⚠︎", "Zwei Einheiten kurz hintereinander", "Iss dazwischen etwas Leichtes mit Kohlenhydraten und trink viel. Mach das Gym kürzer, wenn du merkst, dass die Kraft fehlt."); }
  items.sort((a, b) => a.t - b.t);
  const kind = ev.some(e => e.type === "match") ? "match" : ev.some(e => e.type === "train") ? "train" : "gym";
  return {kind, ev, items};
}

/* Bild verkleinern (quadratisch, 192 px, JPEG), damit es klein in der Datenbank liegt */
function shrinkImage(file){
  return new Promise((ok, fail) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const n = 192, cv = document.createElement("canvas"); cv.width = cv.height = n; const sz = Math.min(img.width, img.height);
      cv.getContext("2d").drawImage(img, (img.width - sz) / 2, (img.height - sz) / 2, sz, sz, 0, 0, n, n); URL.revokeObjectURL(url); ok(cv.toDataURL("image/jpeg", 0.8)); };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error("bild")); };
    img.src = url;
  });
}

/* ----- Pausen-Timer im laufenden Training ----- */
let rest = null, restTick = null;
function restSeconds(txt){
  const t = String(txt || "").toLowerCase().replace(",", ".");
  const m = t.match(/(\d+(?:\.\d+)?)/); if (!m) return cfg().restDefault || 120;
  const v = parseFloat(m[1]);
  return Math.round(/s(ek|\b)/.test(t) && !/min/.test(t) ? v : v * 60);
}
function nextSetLabel(){
  for (const e of (ws && ws.exercises) || []) { const i = (e.sets || []).findIndex(x => !x.done); if (i >= 0) return (exName(e.exId) || e.name) + " – Satz " + (i + 1); }
  return null;
}
function startRest(ei){
  const e = ws.exercises[ei]; const secs = restSeconds(e && e.target && e.target.rest);
  rest = {end: Date.now() + secs * 1000};
  clearInterval(restTick); restTick = setInterval(updateRestBar, 500); updateRestBar();
  schedulePushRest(secs);
}
function schedulePushRest(secs){

  const nxt = nextSetLabel();
  sb.rpc("start_rest_timer", {p_seconds: secs, p_title: "Pause vorbei 💪", p_body: nxt ? "Weiter mit " + nxt + "." : "Weiter geht's mit dem nächsten Satz."});
}
function restAdjust(d){
  if (!rest) return; rest.end += d * 1000; updateRestBar();
  schedulePushRest(Math.max(1, Math.round((rest.end - Date.now()) / 1000)));
}
function stopRest(cancel){

  if (cancel && mode === "db") sb.rpc("cancel_rest_timers");
}
function updateRestBar(){

  if (!rest) { el.hidden = true; return; }
  const left = Math.ceil((rest.end - Date.now()) / 1000);
  if (left <= 0) { rest = null; clearInterval(restTick); el.hidden = true; toast("Pause vorbei – nächster Satz! 💪"); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch(e) {} return; }

/* ----- KI-Essenseingabe (Text oder Sprache) ----- */
let recog = null;
function aiVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR || !af) return;
  if (af.listening && recog) { recog.stop(); return; }
  recog = new SR(); recog.lang = "de-DE"; recog.interimResults = true; recog.continuous = false;
  const base = (($("#aiq") || {}).value || af.aiText || "").trim();
  recog.onresult = ev => { let t = ""; for (const r of ev.results) t += r[0].transcript; af.aiText = (base ? base + " " : "") + t; const el = $("#aiq"); if (el) el.value = af.aiText; };
  recog.onerror = ev => { af.listening = false; af.aiErr = ev.error === "not-allowed" || ev.error === "service-not-allowed" ? "Spracheingabe ist hier nicht erlaubt. Tippe im Textfeld auf das Mikrofon deiner Tastatur." : "Ich habe nichts verstanden. Versuch es noch einmal."; renderAddFood(); };
  recog.onend = () => { const was = af && af.listening; if (!af) return; af.listening = false; renderAddFood(); if (was && af.aiText.trim() && !af.aiErr) runQuickFood(af.aiText); };
  af.listening = true; af.aiErr = ""; renderAddFood();
  let heard = false; recog.onaudiostart = () => { heard = true; };
  setTimeout(() => { if (af && af.listening && !heard) { try { recog.abort(); } catch(e) {} af.listening = false; af.aiErr = "Die Spracheingabe startet hier nicht. Tippe im Textfeld auf das Mikrofon deiner Tastatur."; renderAddFood(); } }, 4000);
  try { recog.start(); } catch(e) { af.listening = false; renderAddFood(); }
}
async function runAiFood(text){
  if (!af || af.aiBusy) return;
  text = String(text || "").trim(); if (text.length < 2) { af.aiErr = "Beschreib kurz, was du gegessen hast."; renderAddFood(); return; }
  af.aiText = text; af.aiBusy = true; af.aiErr = ""; renderAddFood();
  const meal = af.meal, date = curDate;
  const msgs = {daily_limit: "Für heute ist das Limit von 60 KI-Einträgen erreicht.", no_api_key: "Die KI ist noch nicht eingerichtet.", empty: "Beschreib kurz, was du gegessen hast."};
  const fail = m => { if (af) { af.aiBusy = false; af.aiErr = m; renderAddFood(); } else toast(m); };
  const {data: id, error} = await sb.rpc("ai_food_request", {p_text: text});
  if (error) { const k = Object.keys(msgs).find(x => (error.message || "").includes(x)); return fail(k ? msgs[k] : "Die KI ist gerade nicht erreichbar. Versuch es gleich noch einmal."); }
  const t0 = Date.now();
  while (Date.now() - t0 < 70000) {
    await new Promise(r => setTimeout(r, 1200));
    const {data: res} = await sb.rpc("ai_food_result", {p_id: id});
    if (!res || res.status === "pending") continue;
    if (res.status === "error") return fail(res.message === "refusal" ? "Dazu konnte die KI nichts eintragen. Formuliere es anders." : "Die KI hat nicht geantwortet. Versuch es noch einmal.");
    const items = (res.items || []).map(it => ({name: String(it.name || "Unbekannt"), g: Math.round(num(it.g) || 0), kcal: Math.round(num(it.kcal) || 0), p: Math.round((num(it.p) || 0) * 10) / 10, c: Math.round((num(it.c) || 0) * 10) / 10, f: Math.round((num(it.f) || 0) * 10) / 10, src: "ki"})).filter(it => it.kcal > 0 || it.g > 0);
    if (!items.length) return fail("Ich habe darin kein Essen erkannt. Nenne Lebensmittel und am besten die Menge.");
    const d = getDay(date); d.meals = d.meals || {}; d.meals[meal] = (d.meals[meal] || []).concat(items); saveDay(date, d);
    const kc = items.reduce((a, x) => a + x.kcal, 0), pr = items.reduce((a, x) => a + x.p, 0);
    if (af) { af.aiBusy = false; af.aiText = ""; closeSheet(); }
    toast(items.length + (items.length === 1 ? " Eintrag" : " Einträge") + " hinzugefügt: " + fmt(kc) + " kcal, " + fmt(pr) + " g Protein");
    return;
  }
  fail("Die KI hat zu lange gebraucht. Versuch es noch einmal.");
}

const normT = s => String(s || "").toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
const NUMW = {ein: 1, eine: 1, einen: 1, einem: 1, einer: 1, zwei: 2, drei: 3, vier: 4, fuenf: 5, sechs: 6, sieben: 7, acht: 8, zehn: 10, halb: 0.5, halbe: 0.5, halben: 0.5, anderthalb: 1.5, eineinhalb: 1.5};
const UNIT_RE = "kg|kilo|g|gr|gramm|ml|l|liter|stueck|stk|scheiben|scheibe|portionen|portion|el|essloeffel|tl|teeloeffel|tassen|tasse|glaeser|glas|becher|dosen|dose|handvoll|messloeffel|scoops|scoop|riegel|flaschen|flasche|kugeln|kugel";
const FILLER = /\b(ich|hab|habe|hatte|gerade|eben|heute|morgens|mittags|abends|gegessen|getrunken|gefruehstueckt|noch|dazu|zum|zur|fruehstueck|mittagessen|abendessen|snack|so|ca|circa|etwa|ungefaehr|bisschen|etwas|von|vom|aus|mit|dem|den|der|die|das|und)\b/g;
function parseFoodText(text){
  return String(text || "").split(/,(?!\d)|;|\n|\+|\bund\b|\bmit\b|\bsowie\b|\bplus\b/i).map(part => {
    let t = normT(part); if (!t) return null;
    const m = t.match(new RegExp("(?:^|\\s)(\\d+(?:[ .]\\d+)?|" + Object.keys(NUMW).join("|") + ")\\s*(" + UNIT_RE + ")?(?=\\s|$)"));
    let n = null, unit = "";
    if (m) { n = NUMW[m[1]] != null ? NUMW[m[1]] : parseFloat(m[1].replace(" ", ".")); unit = m[2] || ""; t = (t.slice(0, m.index) + " " + t.slice(m.index + m[0].length)); }
    else { const u = t.match(new RegExp("(?:^|\\s)(" + UNIT_RE + ")(?=\\s|$)")); if (u) { unit = u[1]; t = t.replace(u[0], " "); } }
    const name = t.replace(FILLER, " ").replace(/\s+/g, " ").trim();
    return name ? {raw: part.trim(), name, n: n == null ? 1 : n, unit, hasNum: n != null} : null;
  }).filter(Boolean);
}
function matchFood(name){
  const q = normT(name), qw = q.split(" ");
  let best = null, bs = 0;
  const consider = (cand, keys) => keys.forEach(k => { k = normT(k); if (!k) return; let sc = 0;
    if (q === k) sc = 100; else if ((" " + q + " ").includes(" " + k + " ")) sc = 70 + k.length; else if (k.includes(q) && q.length >= 4) sc = 50 + q.length; else if (qw.every(w => k.includes(w)) && q.length >= 4) sc = 45;
    if (sc > bs) { bs = sc; best = cand; } });
  BASE_FOODS.forEach(b => consider({src: "base", name: b[0], kcal: b[2], p: b[3], c: b[4], f: b[5], piece: b[6]}, b[1].split(",")));
  const baseBest = best, baseScore = bs;
  Object.entries(S.foods).forEach(([id, f]) => consider({src: "mine", id, name: f.name, kcal: f.kcal, p: f.p, c: f.c, f: f.f, piece: f.portion}, [f.name]));
  if (best && best.src === "mine" && baseBest && baseScore >= bs - 5 && baseScore >= 70) { best = baseBest; bs = baseScore; }
  return bs >= 45 ? best : null;
}
async function offLookup(name){
  try {
    const items = await offQuery(name); const qw = normT(name).split(" ");
    const pick = items.find(p => qw.every(w => normT(p.name).includes(w))) || items[0];
    return pick ? {src: "off", name: pick.name, kcal: pick.kcal, p: pick.p, c: pick.c, f: pick.f, piece: pick.portion || null} : null;
  } catch(e) { return null; }

function gramsFor(it, food){
  const u = it.unit, n = it.n, piece = food.piece || 100;
  if (u === "g" || u === "gr" || u === "gramm" || u === "ml") return n;
  if (u === "kg" || u === "kilo" || u === "l" || u === "liter") return n * 1000;
  if (u === "el" || u === "essloeffel") return n * (food.f > 80 ? 10 : 15);
  if (u === "tl" || u === "teeloeffel") return n * 5;
  if (u.startsWith("tasse")) return n * 200;
  if (u.startsWith("glas") || u.startsWith("glaes")) return n * 250;
  if (u.startsWith("flasche")) return n * 500;
  if (u === "handvoll") return n * 30;
  if (u.startsWith("messloeffel") || u.startsWith("scoop")) return n * 30;

}
async function runQuickFood(text){

  af.aiText = text; af.aiBusy = true; af.aiErr = ""; renderAddFood();
  const meal = af.meal, date = curDate, parts = parseFoodText(text), items = [], missing = [];
  for (const it of parts) {
    let food = matchFood(it.name);
    if (!food) { food = await offLookup(it.name); if (food) { const id = uid("f"); put("foods", id, {name: food.name, kcal: Math.round(food.kcal), p: food.p, c: food.c, f: food.f, portion: food.piece || undefined, uses: 1, src: "openfoodfacts"}); } }
    if (!food) { missing.push(it.raw); continue; }
    const g = Math.round(gramsFor(it, food)), k = g / 100;
    items.push({name: food.name, g, kcal: Math.round(food.kcal * k), p: Math.round(food.p * k * 10) / 10, c: Math.round(food.c * k * 10) / 10, f: Math.round(food.f * k * 10) / 10, src: "schnell"});
  }
  if (!af) return;
  if (!items.length) { af.aiBusy = false; af.aiErr = "Dazu habe ich nichts gefunden. Nenne das Lebensmittel etwas einfacher, z. B. „200 g Hähnchen“, oder leg es unter „Neues Lebensmittel“ an."; renderAddFood(); return; }
  const d = getDay(date); d.meals = d.meals || {}; d.meals[meal] = (d.meals[meal] || []).concat(items); saveDay(date, d);
  const kc = items.reduce((a, x) => a + x.kcal, 0), pr = items.reduce((a, x) => a + x.p, 0);

  closeSheet();

/* ---------- Diagramme ---------- */
function niceTicks(min, max, n = 4){
  const span = max - min || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw) || raw;
  const out = []; for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}
function drawCharts(){
  document.querySelectorAll("[data-chart]").forEach(el => {
    const kind = el.dataset.chart;
    if (kind === "weight") drawWeight(el, false);
    else if (kind === "spark") drawWeight(el, true);
    else if (kind === "sleep") drawSleep(el);
    else if (kind === "ex") drawEx(el);
    else if (kind === "recovery") drawRecovery(el);
  });
}
function drawRecovery(el){
  const t = todayKey();
  const days = Array.from({length: 14}, (_, i) => { const k = addDays(t, i - 13); const r = recoveryOf(k); return {k, r: r ? r.score : null, s: strainOf(k)}; });
  const W = Math.max(240, el.clientWidth), H = el.clientHeight || 190, padL = 30, padR = 6, padT = 8, padB = 38;
  const Y = v => padT + (1 - v / 100) * (H - padT - padB);
  const bw = (W - padL - padR) / 14;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Erholung und Belastung der letzten 14 Tage">`;
  [0, 33, 67, 100].forEach(v => { s += `<line x1="${padL}" x2="${W - padR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${padL - 5}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`; });
  days.forEach((d, i) => {
    const x = padL + i * bw + 2, w = Math.max(4, bw - 4);
    if (d.r != null) { const y = Y(d.r); const col = {good: "var(--good)", warn: "var(--warn)", bad: "var(--bad)"}[zoneOf(d.r)]; s += `<path d="M${x},${Y(0)} V${y + 4} q0,-4 4,-4 h${w - 8} q4,0 4,4 V${Y(0)} Z" fill="${col}"/>`; }
    s += `<text x="${x + w / 2}" y="${H - 22}" text-anchor="middle" style="fill:var(--ink-2);font-weight:600">${d.s ? fmt(d.s, 0) : "·"}</text>`;
    if (i % 2 === 1 || bw > 30) s += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${WD[dateOf(d.k).getDay()]}</text>`;
    s += `<rect class="hb" data-i="${i}" x="${padL + i * bw}" y="0" width="${bw}" height="${H}" fill="transparent"/>`;
  });
  s += "</svg>";
  el.innerHTML = s + '<div class="tip" hidden></div>';
  const tip = el.querySelector(".tip"), svg = el.querySelector("svg");
  el.querySelectorAll(".hb").forEach(r => { const show = () => { const d = days[+r.dataset.i]; const rr = svg.getBoundingClientRect(); tip.innerHTML = `<b>${fmtMid(d.k)}</b><br>Erholung ${d.r != null ? d.r + " %" : "–"}<br>Belastung ${fmt(d.s, 1)}`; tip.hidden = false; tip.style.left = Math.min(Math.max((padL + (+r.dataset.i + .5) * bw) / W * rr.width, 60), rr.width - 60) + "px"; tip.style.top = (Y(d.r || 0) / H * rr.height) + "px"; }; r.addEventListener("pointerenter", show); r.addEventListener("pointerdown", show); });
  svg.addEventListener("pointerleave", () => tip.hidden = true);
}
function lineChart(el, o){
  const W = Math.max(240, el.clientWidth), H = el.clientHeight || 220;
  const spark = !!o.spark;
  const padL = spark ? 4 : 36, padR = spark ? 6 : 12, padT = spark ? 6 : 10, padB = spark ? 6 : 24;
  const pts = o.points;
  if (!pts.length) { el.innerHTML = `<div class="empty" style="padding:${spark ? 6 : 30}px">${esc(o.empty || "Noch keine Daten.")}</div>`; return; }
  const t0 = dateOf(o.from || pts[0].k).getTime(), t1 = Math.max(dateOf(pts[pts.length - 1].k).getTime(), o.to ? dateOf(o.to).getTime() : 0, t0 + 864e5 * 6);
  let vals = pts.map(p => p.v).concat((o.line || []).map(p => p.v));
  if (o.band && !spark) vals = vals.concat(o.band);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const padV = Math.max((hi - lo) * 0.08, o.minPad || 0.5); lo -= padV; hi += padV;
  const X = k => padL + (dateOf(k).getTime() - t0) / (t1 - t0) * (W - padL - padR);
  const Y = v => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.label || "Diagramm")}">`;
  if (!spark) {
    niceTicks(lo, hi, 4).forEach(v => { s += `<line x1="${padL}" x2="${W - padR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${padL - 6}" y="${Y(v) + 4}" text-anchor="end">${fmt(v, o.dec || 0)}</text>`; });
    const days = (t1 - t0) / 864e5, n = Math.min(5, Math.max(2, Math.floor((W - padL) / 90)));
    for (let i = 0; i < n; i++) { const t = t0 + (t1 - t0) * i / (n - 1); const k = keyOf(new Date(t)); s += `<text x="${X(k)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}">${days > 300 ? MON[dateOf(k).getMonth()].slice(0, 3) + " " + String(dateOf(k).getFullYear()).slice(2) : fmtShort(k)}</text>`; }
  }
  if (o.band && !spark) s += o.band[0] === o.band[1]
    ? `<line x1="${padL}" x2="${W - padR}" y1="${Y(o.band[0])}" y2="${Y(o.band[0])}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W - padR}" y="${Y(o.band[0]) - 5}" text-anchor="end">Ziel ${fmt(o.band[0], 1)} kg</text>`
    : `<rect x="${padL}" width="${W - padL - padR}" y="${Y(o.band[1])}" height="${Math.max(2, Y(o.band[0]) - Y(o.band[1]))}" fill="var(--accent-soft)"/>`;
  if (o.connect) s += `<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p => X(p.k) + "," + Y(p.v)).join(" ")}"/>`;
  if (o.line && o.line.length > 1) s += `<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${o.line.map(p => X(p.k) + "," + Y(p.v)).join(" ")}"/>`;
  if (!spark || pts.length < 40) pts.forEach(p => { s += `<circle cx="${X(p.k)}" cy="${Y(p.v)}" r="${spark ? 2 : o.connect ? 4 : 3.5}" fill="${o.connect ? "var(--accent)" : "var(--muted)"}" stroke="var(--surface)" stroke-width="${o.connect ? 2 : 0}"/>`; });
  const endP = (o.line && o.line.length) ? o.line[o.line.length - 1] : pts[pts.length - 1];
  s += `<circle cx="${X(endP.k)}" cy="${Y(endP.v)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  s += `<line class="xh" y1="${padT}" y2="${H - padB}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>`;
  s += `<rect x="${padL}" y="0" width="${W - padL - padR}" height="${H}" fill="transparent" class="hit"/></svg>`;
  el.innerHTML = s + '<div class="tip" hidden></div>';
  if (spark) return;
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), xh = el.querySelector(".xh");
  const move = ev => {
    const r = svg.getBoundingClientRect(); const x = (ev.clientX - r.left) * (W / r.width);
    let best = pts[0], bd = 1e9; pts.forEach(p => { const d = Math.abs(X(p.k) - x); if (d < bd) { bd = d; best = p; } });
    const lv = o.line ? (o.line.find(p => p.k === best.k) || {}).v : null;
    tip.innerHTML = o.tip(best, lv);
    tip.hidden = false; tip.style.left = Math.min(Math.max(X(best.k) / W * r.width, 60), r.width - 60) + "px"; tip.style.top = (Y(best.v) / H * r.height) + "px";
    xh.setAttribute("x1", X(best.k)); xh.setAttribute("x2", X(best.k)); xh.setAttribute("opacity", "1");
  };
  svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", () => { tip.hidden = true; xh.setAttribute("opacity", "0"); });
}
function drawWeight(el, spark){
