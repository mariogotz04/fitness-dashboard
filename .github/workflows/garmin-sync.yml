name: Garmin-Abruf

# Läuft nur auf Knopfdruck aus der App (workflow_dispatch über die Datenbank) oder per Hand.
# Keine pull_request-Auslöser: Änderungsvorschläge von außen können diesen Ablauf nicht starten.
on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Garmin-Konto (main, slot2, ...)"
        required: false
        default: "main"

permissions:
  contents: read

concurrency:
  group: garmin-sync-${{ inputs.slot || 'main' }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'mariogotz04/fitness-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: pip install --quiet garminconnect==0.2.8 garth==0.4.47
      - name: Garmin-Daten übertragen
        env:
          GARMIN_TOKENS: ${{ secrets[format('GARMIN_TOKENS_{0}', inputs.slot || 'main')] }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SYNC_TOKEN: ${{ secrets[format('SYNC_TOKEN_{0}', inputs.slot || 'main')] }}
          PYTHONWARNINGS: ignore
        run: python garmin/garmin_sync.py --push --days 4
