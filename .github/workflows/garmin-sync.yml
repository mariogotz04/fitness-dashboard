name: Garmin-Abruf

# Läuft nur nach Zeitplan oder per Hand durch den Besitzer.
# Keine pull_request-Auslöser: Änderungsvorschläge von außen können diesen Ablauf nicht starten.
on:
  schedule:
    - cron: "15 6 * * *"   # 08:15 (Sommerzeit) / 07:15 (Winterzeit)
    - cron: "15 11 * * *"  # 13:15 / 12:15
    - cron: "15 19 * * *"  # 21:15 / 20:15
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'mariogotz04/fitness-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: pip install --quiet garminconnect==0.2.8 garth==0.4.47
      - name: Garmin-Daten übertragen
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          PYTHONWARNINGS: ignore
        run: python garmin/garmin_sync.py --push --days 4
