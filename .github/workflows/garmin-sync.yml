name: Garmin-Abruf

# Läuft nur nach Zeitplan oder per Hand durch den Besitzer.
# Keine pull_request-Auslöser: Änderungsvorschläge von außen können diesen Ablauf nicht starten.
on:
  schedule:
    - cron: "15 4-21 * * *"   # stündlich von 06:15 bis 23:15 (Sommerzeit), im Winter eine Stunde früher
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # nur für den Keepalive-Schritt unten

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'mariogotz04/fitness-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: pip install --quiet garminconnect==0.2.8 garth==0.4.47
      - name: Garmin-Daten übertragen
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          PYTHONWARNINGS: ignore
        run: python garmin/garmin_sync.py --push --days 4
      - name: Zeitplan aktiv halten
        # GitHub pausiert Zeitpläne nach 60 Tagen ohne Änderungen am Repository. Das hält ihn aktiv.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/garmin-sync.yml/enable" --silent
