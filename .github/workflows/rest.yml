name: Pausen-Timer

# Wird nur von der Datenbank angestoßen, wenn im laufenden Training ein Satz abgehakt wurde.
# Keine pull_request-Auslöser: Änderungsvorschläge von außen können diesen Ablauf nicht starten.
on:
  workflow_dispatch:
    inputs:
      timer:
        description: "Timer-ID"
        required: true

permissions:
  contents: read

jobs:
  wait-and-notify:
    if: github.repository == 'mariogotz04/fitness-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: pip install --quiet pywebpush==2.1.2
      - name: Warten und Mitteilung schicken
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          TIMER_ID: ${{ inputs.timer }}
        run: python notify/rest_push.py
