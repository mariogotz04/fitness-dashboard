name: Mitteilungen

# Wird nur von der Datenbank angestoßen (workflow_dispatch), wenn eine Erinnerung fällig ist.
# Keine pull_request-Auslöser: Änderungsvorschläge von außen können diesen Ablauf nicht starten.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  send:
    if: github.repository == 'mariogotz04/fitness-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: pip install --quiet pywebpush==2.1.2
      - name: Mitteilungen verschicken
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
        run: python notify/send_push.py
